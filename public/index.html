<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e2ff">
<title>Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ff:"Plus Jakarta Sans",system-ui,sans-serif;--bg1:#ece5ff;--bg2:#f8e8fb;--card:rgba(255,255,255,.72);--tx:#2a2552;--mu:#7a76a3;--pri:#6c5ce7;--pri2:#8e6cf7;--ok:#1f9d63;--warn:#c98a10;--er:#d9485a;--chip:#efeafd;
--sh:9px 9px 22px rgba(112,92,200,.16),-7px -7px 18px rgba(255,255,255,.95),inset 0 1px 0 #fff}
:root[data-theme=dark]{--bg1:#16132e;--bg2:#221a3f;--card:rgba(40,34,78,.78);--tx:#ece9ff;--mu:#a29ec8;--chip:#2e2757;--sh:9px 9px 22px rgba(0,0,0,.4),-5px -5px 16px rgba(120,100,220,.08),inset 0 1px 0 rgba(255,255,255,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font:500 14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--tx);background:linear-gradient(170deg,var(--bg1),var(--bg2)) fixed;padding:env(safe-area-inset-top) 0 0}
.w{max-width:560px;margin:auto;padding:0 14px 120px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 4px;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg1) 70%,transparent)}
.logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
header b{flex:1;font-size:16px;font-weight:700}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);color:var(--tx);font-size:16px;cursor:pointer}
h2{font-size:30px;margin:2px 0 14px;font-weight:800;letter-spacing:-.5px}h3{margin:0;font-size:18px;font-weight:700}
.hi{color:var(--mu);margin-top:8px}
.card{background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.big{font-size:36px;font-weight:800;letter-spacing:-1px}.sm{color:var(--mu);font-size:12px}
button.pri{width:100%;margin-top:12px;padding:15px;border:0;border-radius:20px;font:700 15px var(--ff);color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 10px 22px rgba(108,92,231,.38),inset 0 1px 0 rgba(255,255,255,.35);cursor:pointer}
button.pri:disabled{opacity:.55}button.gh{padding:13px;border:0;border-radius:18px;background:var(--chip);color:var(--tx);font:700 14px var(--ff);cursor:pointer;flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two .card b{display:block;font-size:26px;margin-top:6px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px}.sec a{color:var(--pri);font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:center;cursor:pointer;margin:0}.tile .em{font-size:30px}.tile b{display:block;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chip{flex:none;padding:10px 16px;border-radius:16px;background:var(--card);box-shadow:var(--sh);border:0;color:var(--tx);font:700 13px var(--ff);cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.svc{display:flex;gap:12px;align-items:center}.svc>div{flex:1;min-width:0}.svc b{display:block}.svc button{padding:11px 16px;width:auto;margin:0;flex:none}
.pr{color:var(--pri);font-weight:800}
.badge{display:inline-block;padding:3px 12px;border-radius:12px;background:var(--chip);color:var(--pri);font-size:11px;font-weight:700}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.er{color:var(--er)}
.meth{text-align:center;cursor:pointer}.meth .em{font-size:34px}.meth b{display:block;margin:6px 0 2px}
.row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid rgba(124,108,200,.14);cursor:pointer}.row:first-child{border:0}
.row .ic{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center}.row>div{flex:1;min-width:0}.row b{display:block}
.row select{padding:8px;border-radius:12px;border:0;background:var(--chip);color:var(--tx);font:600 13px var(--ff)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--chip);position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--pri)}.sw.on::after{left:21px}
input.f{width:100%;padding:14px;margin-top:10px;border:0;border-radius:16px;background:var(--chip);color:var(--tx);font:600 14px var(--ff);outline:2px solid transparent}
input.f:focus-visible,button:focus-visible{outline:2px solid var(--pri)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:auto;display:flex;justify-content:space-around;padding:8px;border-radius:30px;background:var(--card);backdrop-filter:blur(18px);box-shadow:var(--sh);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mu);font:600 10px var(--ff);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:22px;cursor:pointer}
nav button i{font-style:normal;font-size:18px}nav button.on{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 8px 18px rgba(108,92,231,.4)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(30,20,70,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px}
.md{width:100%;max-width:420px;max-height:88vh;overflow:auto;background:var(--bg1);border-radius:28px;padding:20px;box-shadow:var(--sh);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}@media(prefers-reduced-motion:reduce){.md{animation:none}.sw::after{transition:none}}
.md h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.md .x{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);color:var(--tx);cursor:pointer}
.md ul{padding-left:18px;margin:8px 0}.btns{display:flex;gap:10px;margin-top:14px}.btns .pri{margin:0}
.o{margin-bottom:14px}.o p{margin:3px 0;word-break:break-all}
.login{min-height:80vh;display:flex;align-items:center}.login .card{width:100%;text-align:center;padding:26px 20px}
.login .logo{width:84px;height:84px;margin:0 auto 12px;font-size:30px}
#toast{position:fixed;left:16px;right:16px;bottom:96px;max-width:520px;margin:auto;padding:13px 16px;border-radius:18px;color:#fff;font-weight:600;display:none;z-index:30;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.hide{display:none!important}.mu{color:var(--mu)}
</style></head><body><div class="w">
<header id="hd" class="hide"><div class="logo" id="lg">S</div><b id="st">Store</b><button class="ib" aria-label="Settings" onclick="go('set')">⋯</button><button class="ib" aria-label="Refresh" onclick="refresh(1)">↻</button></header>
<main id="view"></main>
</div>
<nav id="nav" class="hide">
 <button data-p="home"><i>⌂</i>Home</button><button data-p="buy"><i>🛒</i>Buy</button><button data-p="add"><i>▣</i>Recharge</button><button data-p="ord"><i>▤</i>Orders</button><button data-p="set"><i>⚙</i>Settings</button>
</nav>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let C={},M=null,P=[],O=[],pg='home',pl=0,CUR=pref('cur')||'INR',TRK='';
document.documentElement.dataset.theme=pref('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const mny=v=>CUR=='USDT'?'$'+(v/(M?.fx||90)).toFixed(2):'₹'+Number(v).toFixed(2);
const alt=v=>CUR=='USDT'?'₹'+Number(v).toFixed(2):'$'+(v/(M?.fx||90)).toFixed(2);
function say(t,ok){const m=$('toast');m.textContent=t;m.style.background=ok?'var(--ok)':'var(--er)';m.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>m.style.display='none',4200)}
async function api(u,b){const r=await fetch('/api/index?path='+encodeURIComponent(u.slice(5)),b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
 const d=await r.json().catch(()=>({}));if(r.status==401&&u!='/api/login'){login();throw 0}if(!r.ok){say(d.detail||('Server error '+r.status+' ('+u.slice(5)+')'));throw 0}return d}
const logoHtml=()=>C.logo?`<img src="${esc(C.logo)}" alt="">`:esc((C.store||'S')[0]);
function login(){M=null;if(C.err){$('view').innerHTML='<div class="login"><div class="card"><h3>Server part not found</h3><p class="mu">The /api part of the site is not running. Check that <b>api/index.js</b> and <b>vercel.json</b> are in the GitHub repo, then redeploy.</p></div></div>';return}$('hd').classList.add('hide');$('nav').classList.add('hide');
 $('view').innerHTML=`<div class="login"><div class="card"><div class="logo">${logoHtml()}</div><h2 style="margin:0">${esc(C.store)}</h2><p class="mu">${C.demo?'Demo mode: sample data only.':'Log in with the Telegram account you use in our bot. Your wallet and orders are shared.'}</p><div id="wg" style="display:flex;justify-content:center;min-height:44px"></div></div></div>`;
 if(C.demo){$('wg').innerHTML='<button class="pri" style="margin:0" onclick="onTg({})">✈️ Continue with Telegram (demo)</button>';return}
 const s=document.createElement('script');s.async=true;s.src='https://telegram.org/js/telegram-widget.js?22';
 [['login',C.bot],['size','large'],['radius','14'],['userpic','false'],['onauth','onTg(user)'],['request-access','write']].forEach(([k,v])=>s.setAttribute(k=='login'?'data-telegram-login':'data-'+k,v));$('wg').appendChild(s)}
async function onTg(u){await api('/api/login',u);start()}
async function refresh(t){try{M=await api('/api/me');if(t)say('Updated',true);draw()}catch(e){}}
async function start(){try{M=await api('/api/me');P=await api('/api/services');O=await api('/api/orders');$('hd').classList.remove('hide');$('nav').classList.remove('hide');draw()}catch(e){}}
function go(p){pg=p;if(p=='ord')api('/api/orders').then(o=>{O=o;draw()});draw();scrollTo(0,0)}
function draw(){if(!M)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==pg));$('view').innerHTML=({home,buy,add,ord,set})[pg]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
const bal=(cta)=>`<div class="card"><div class="sm">💳 ${cta?'Total Balance':'Current Balance'}</div><div class="big">${mny(M.balance)} <span class="sm">${alt(M.balance)}</span></div>${cta?'<button class="pri" onclick="go(\'add\')">+ Add Balance</button>':''}</div>`;
function home(){return `<div class="hi">Welcome back,</div><h2>${esc(M.name||'friend')}</h2>
<div class="card"><b>🛍 ${esc(C.store)}</b><p class="mu" style="margin:4px 0 0">Fast and secure social media services. Pick a platform below to see live pricing.</p></div>${bal(1)}
<div class="two"><div class="card"><span class="sm">⚡ Total Recharge</span><b>${M.recharges}</b></div><div class="card"><span class="sm">🔑 Total Orders</span><b>${M.orders}</b></div></div>
<div class="sec"><h3>Available Services</h3><a onclick="go('buy')">View All →</a></div>
<div class="grid">${P.map((p,i)=>`<div class="card tile" onclick="pl=${i};go('buy')"><div class="em">${esc(p.label.split(' ')[0])}</div><b>${esc(p.label.split(' ').slice(1).join(' '))}</b><span class="sm">${p.items.length} services</span></div>`).join('')||'<p class="mu">No services yet.</p>'}</div>`}
function buy(){const p=P[pl];return `<h2>Buy</h2><div class="chips">${P.map((x,i)=>`<button class="chip ${i==pl?'on':''}" onclick="pl=${i};draw()">${esc(x.label)}</button>`).join('')}</div>`+
 (p?p.items.map((s,j)=>`<div class="card svc"><div><b>${esc(s.name)}</b><span class="sm">Min ${s.min} · Max ${s.max}</span><br><span class="pr">${mny(s.rate)}</span> <span class="sm">per 1000</span></div><button class="pri" onclick="terms(${j})">Buy Now</button></div>`).join(''):'<p class="mu">No services yet.</p>')}
function sheet(h){closeS();const d=document.createElement('div');d.className='ov';d.id='ov';d.onclick=e=>{if(e.target==d)closeS()};d.innerHTML=`<div class="md" role="dialog">${h}</div>`;document.body.appendChild(d)}
const closeS=()=>$('ov')?.remove();
const X='<button class="x" aria-label="Close" onclick="closeS()">✕</button>';
function terms(j){const s=P[pl].items[j];window.S=s;sheet(`<h3>⚠ Purchase Terms${X}</h3><b>Order terms</b><ul><li>Check that your link is public and correct.</li><li>An order can’t be cancelled once it starts.</li><li>If an order fails, the money returns to your wallet automatically.</li><li>Delivery time depends on the service.</li></ul><div class="card" style="text-align:center;margin:12px 0 0"><span class="pr">${esc(s.name)} · ${mny(s.rate)}/1000</span></div><div class="btns"><button class="gh" onclick="closeS()">Decline</button><button class="pri" onclick="orderForm()">Accept</button></div>`)}
function orderForm(){const s=window.S;sheet(`<h3>${esc(s.name)}${X}</h3><span class="sm">Min ${s.min} · Max ${s.max}</span><input class="f" id="lk" placeholder="Link (post / profile / channel)"><input class="f" id="qt" type="number" inputmode="numeric" placeholder="Quantity" oninput="$('tt').textContent=this.value?'Total: '+mny(S.rate*this.value/1000):''"><p class="pr" id="tt"></p><button class="pri" id="go" onclick="order()">Place order</button>`)}
async function order(){$('go').disabled=true;try{const d=await api('/api/order',{service_id:S.id,link:$('lk').value,qty:+$('qt').value});closeS();say(d.note||'✅ Order placed: '+d.oid,true);refresh();O=await api('/api/orders')}catch(e){}$('go')&&($('go').disabled=false)}
function add(){const o=[];if(M.upi)o.push(['upi','UPI Gateway','🇮🇳','Scan QR & pay — auto verification']);if(M.bpay)o.push(['bp','Binance Pay (Auto)','🅱️','Send to Pay ID & verify']);if(M.crypto)o.push(['cr','Crypto (Auto)','🪙','Pay with any coin']);
 return `<h2>Recharge Balance</h2>${bal(0)}`+(o.map(m=>`<div class="card meth" onclick="pay('${m[0]}')"><div class="em">${m[2]}</div><b>${m[1]}</b><span class="sm">${m[3]}</span><br><span class="badge ok">ON</span></div>`).join('')||'<p class="mu">Add funds is unavailable right now.</p>')}
const amts=()=>`<div class="btns" style="margin:10px 0 0">${[50,100,200,500].map(a=>`<button class="gh" onclick="$('am').value=${a}">₹${a}</button>`).join('')}</div><input class="f" id="am" type="number" inputmode="numeric" placeholder="Amount ₹">`;
function pay(m){TRK='';if(m=='bp')return sheet(`<h3>Binance Pay${X}</h3><p>Pay USDT by Binance Pay to Pay ID <b>${esc(M.bpay_id)}</b>, then paste the Order ID.</p><input class="f" id="bo" placeholder="Binance Pay Order ID"><button class="pri" onclick="bpVerify()">Verify payment</button>`);
 if(m=='cr')return sheet(`<h3>Crypto${X}</h3>${amts()}<button class="pri" onclick="crStart()">Create invoice</button><div id="cry"></div>`);
 sheet(`<h3>UPI Gateway${X}</h3>${amts()}<button class="pri" onclick="topStart()">Pay by UPI</button><div id="up"></div>`)}
async function topStart(){const d=await api('/api/topup/start',{amount:+$('am').value});$('up').innerHTML=`<p>Pay <b>₹${d.amount}</b> to <b>${esc(d.upi)}</b></p><a href="${esc(d.link)}"><button class="gh" style="width:100%">Open UPI app</button></a><input class="f" id="utr" placeholder="UTR / transaction ID after paying"><button class="pri" onclick="topVerify()">Verify payment</button>`}
async function topVerify(){await api('/api/topup/verify',{utr:$('utr').value});done()}
async function bpVerify(){const d=await api('/api/topup/bpay',{order_id:$('bo').value});done(d.added)}
async function crStart(){const d=await api('/api/topup/crypto',{amount:+$('am').value});TRK=d.track;$('cry').innerHTML=`<p>Pay <b>${d.usd} USDT</b> — you get <b>₹${d.inr}</b></p><a href="${esc(d.url)}" target="_blank" rel="noopener"><button class="pri">💳 Pay now</button></a><button class="gh" style="width:100%;margin-top:10px" onclick="crCheck()">🔄 Check payment</button>`}
async function crCheck(){const d=await api('/api/topup/crypto/check',{track:TRK});if(d.status=='paid')done();else say(d.status=='pending'?'Not received yet. Wait for the network to confirm.':'Invoice '+d.status+'.')}
function done(n){closeS();say('✅ Money added'+(n?': ₹'+n:''),true);refresh()}
const chip=s=>{const l=(s||'').toLowerCase();return `<span class="badge ${l=='completed'?'ok':/cancel|fail|refund|reject/.test(l)?'er':'warn'}">${esc(s)}</span>`};
function ord(){return `<h2>Order History</h2>`+(O.map(r=>`<div class="card o"><b>${esc(r.name)}</b><p class="mu">${esc(r.link)}</p><p>Quantity: <b>${r.qty}</b></p><p class="sm">${r.when} · ${r.oid}</p><div style="display:flex;justify-content:space-between;margin-top:8px"><span class="pr">${mny(r.cost)}</span>${chip(r.status)}</div></div>`).join('')||'<p class="mu">No orders yet.</p>')}
const lk=u=>u?(u.startsWith('http')?u:'https://t.me/'+u.replace('@','')):'';
function set(){const r=(ic,t,s,extra,on)=>`<div class="row" ${on?`onclick="${on}"`:''}><span class="ic">${ic}</span><div><b>${t}</b><span class="sm">${s}</span></div>${extra||''}</div>`;
 return `<h2>Settings</h2><div class="card" style="padding:6px 14px">`+
 r('🤖','Telegram account',`Connected as ${esc(M.name)} (ID: ${M.id})`)+
 r('💱','Currency','Choose display currency',`<select onchange="CUR=this.value;pref('cur',CUR);draw()"><option ${CUR=='INR'?'selected':''} value="INR">₹ INR</option><option ${CUR=='USDT'?'selected':''} value="USDT">$ USDT</option></select>`)+
 r('🌙','Dark Mode','Switch the store theme',`<span class="sw ${document.documentElement.dataset.theme=='dark'?'on':''}"></span>`,'tg()')+
 r('📄','Terms & Conditions','Read store terms','','terms2()')+
 (C.channel?r('📣','Telegram Channel','Join for updates & offers','↗',`open('${esc(lk(C.channel))}','_blank')`):'')+
 (C.support?r('🎧','Contact Support','Direct message on Telegram','↗',`open('${esc(lk(C.support))}','_blank')`):'')+
 r('🚪','Logout','Sign out from this device','','out()')+`</div>`}
function tg(){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;pref('theme',t);draw()}
function terms2(){sheet(`<h3>Terms & Conditions${X}</h3><ul><li>Orders can’t be cancelled once they start.</li><li>Failed orders are refunded to your wallet automatically.</li><li>Wallet money is used only for orders in this store.</li></ul>`)}
async function out(){await api('/api/logout',{});login()}
(async()=>{try{C=await(await fetch('/api/index?path=config')).json()}catch(e){C={err:1,store:'Store'}}document.title=C.store||'Store';$('st').textContent=C.store||'Store';$('lg').innerHTML=logoHtml();
 try{await api('/api/me');start()}catch(e){if(!M&&!document.querySelector('.login'))login()}})();
</script></body></html>

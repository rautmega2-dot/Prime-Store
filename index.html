<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Store</title>
<style>
:root{--bg1:#F1EEFF;--bg2:#D9CFFF;--ink:#1D1548;--mut:#5f5690;--pri:#6C4DF6;--pri2:#8B73FF;--btn1:#8B73FF;--btn2:#5B3DE0;--btnink:#fff;--card:rgba(255,255,255,.62);--line:rgba(91,61,224,.16);--ok:#16966a;--bad:#d23a62;--sh:0 12px 32px rgba(91,61,224,.18);--blob:#8B73FF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1B1445;--bg2:#0E0A26;--ink:#EDE9FF;--mut:#B4A9E8;--pri:#B7A8FF;--pri2:#8B73FF;--btn1:#8B73FF;--btn2:#5B3DE0;--card:rgba(237,233,255,.07);--line:rgba(237,233,255,.14);--ok:#5bd69b;--bad:#ff7d9d;--sh:0 12px 32px rgba(0,0,0,.5);--blob:#5B3DE0;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1B1445;--bg2:#0E0A26;--ink:#EDE9FF;--mut:#B4A9E8;--pri:#B7A8FF;--pri2:#8B73FF;--btn1:#8B73FF;--btn2:#5B3DE0;--card:rgba(237,233,255,.07);--line:rgba(237,233,255,.14);--ok:#5bd69b;--bad:#ff7d9d;--sh:0 12px 32px rgba(0,0,0,.5);--blob:#5B3DE0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;background:var(--blob);filter:blur(90px);opacity:.35;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
body::before{top:-120px;left:-100px}body::after{bottom:-140px;right:-120px;animation-delay:-9s}
@keyframes drift{to{transform:translate(60px,70px) scale(1.15)}}
#app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--btnink);background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:var(--sh)}
.top b{font-size:17px}.top .sp{flex:1}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.hi h1{font-size:30px;margin-top:2px}
.btn{width:100%;border:0;border-radius:18px;padding:14px;font:700 15px inherit;font-family:inherit;color:var(--btnink);background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 8px 20px rgba(108,77,246,.38);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.45;box-shadow:none}
.btn.sm{padding:9px;font-size:13px;border-radius:14px;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.big{font-size:38px;font-weight:800;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2 .card{margin:0}
.stat b{display:block;font-size:24px;margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.row a{color:var(--pri);font-size:13px;font-weight:700;cursor:pointer}
.cn{text-align:center;padding:14px 10px;transition:transform .2s}
.cn:active{transform:scale(.97)}
.fl{font-size:34px;line-height:1.1}
.cn .nm{font-weight:700;margin-top:4px}
.pr{font-size:20px;font-weight:800;margin:6px 0 0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--ink)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
input,select{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(108,77,246,.28)}
input::placeholder{color:var(--mut);opacity:.8}
.meth{display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid transparent;transition:border-color .2s,transform .15s}
.meth:active{transform:scale(.98)}.meth.on{border-color:var(--pri2)}
.meth .mi{font-size:26px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--line)}
.meth div{flex:1}.meth b{display:block}
.chips{display:flex;gap:8px;margin:10px 0}
.chips span{flex:1;text-align:center;padding:8px;border-radius:14px;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:13px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item div{flex:1}.item small{display:block;color:var(--mut)}
.sk{height:14px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,var(--line),rgba(255,255,255,.35),var(--line));background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.set:last-child{border:0}.set div{flex:1}.set small{display:block;color:var(--mut);font-size:12px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:var(--pri2)}.sw.on::after{transform:translateX(20px)}
select{width:auto;padding:8px 10px;border-radius:12px}
nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(456px,calc(100% - 24px));display:flex;padding:6px;border-radius:30px;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:var(--sh);z-index:5}
nav i{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:24px;background:linear-gradient(135deg,var(--btn1),var(--btn2));transition:transform .45s cubic-bezier(.3,1.25,.5,1);box-shadow:0 6px 16px rgba(108,77,246,.45)}
nav button{flex:1;position:relative;border:0;background:none;color:var(--mut);padding:8px 0 6px;font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .3s}
nav button.on{color:var(--btnink)}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-80px);background:var(--ink);color:var(--bg1);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;transition:transform .4s cubic-bezier(.3,1.3,.5,1);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(18,12,48,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:min(480px,100%);background:var(--bg1);color:var(--ink);border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{transform:translateY(100%)}}
.sheet p{display:flex;justify-content:space-between;margin:8px 0}
.lg{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center}
.lg .logo{width:84px;height:84px;font-size:36px;margin:0 auto 14px;animation:pop .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.lg h1{text-align:center;font-size:28px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs span{flex:1;text-align:center;padding:9px 4px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--line);opacity:.55}
.tabs span.on{opacity:1;background:var(--card);border-color:var(--pri2)}
.hero{background:linear-gradient(135deg,#8B73FF,#5B3DE0 72%);color:#fff;border:0;position:relative;overflow:hidden;box-shadow:0 16px 36px rgba(91,61,224,.42)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.14);animation:drift 12s ease-in-out infinite alternate}
.hero>*{position:relative;z-index:1}
.hero .mut{color:rgba(255,255,255,.8)}
.hero .btn{background:#fff;color:#4a2fd0;box-shadow:none}
.cn .fl{width:60px;height:60px;margin:0 auto 6px;display:grid;place-items:center;border-radius:50%;background:var(--line);font-size:32px}
.cn{background:linear-gradient(180deg,var(--card),transparent 140%)}
.chips span.on{border-color:var(--pri2);background:var(--card)}
.tiles{margin-top:14px}
.sq{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;padding:16px;transition:transform .2s}
.sq:active{transform:scale(.97)}
.sq .em{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 8px 20px rgba(108,77,246,.38)}
.sq.alt .em{background:var(--line);box-shadow:none}
.sq b{display:block;font-size:17px;line-height:1.2}
.sq .mut{display:block;margin-top:4px}
.sel{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.sel:last-child{border:0}.sel>div{flex:1;min-width:0}.sel small{display:block;color:var(--mut);font-size:12px}.sel b{display:block;overflow-wrap:anywhere}
.sel .ch{flex:none;color:var(--mut);font-size:26px;line-height:1}.sel.dis{opacity:.4;pointer-events:none}.sel.on b{color:var(--pri)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.kv span{color:var(--mut);flex:none}.kv b{text-align:right;overflow-wrap:anywhere;min-width:0}
.cp{margin-left:8px;border:1px solid var(--line);background:var(--card);color:var(--pri);border-radius:10px;padding:2px 9px;font:700 12px inherit;font-family:inherit;cursor:pointer}
.ord{cursor:pointer}.ord .ch{flex:none;color:var(--mut);font-size:22px}
.tot{display:flex;justify-content:space-between;margin:12px 2px 4px;font-weight:700}
.err{color:var(--bad);font-size:13px;margin:8px 2px;min-height:18px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onerror="window.QRCode=null"></script>
<script>
const $=s=>document.querySelector(s),RATE=90;
const ST={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={user:null,tab:"home",cur:ST.get("ps_cur","INR"),dark:ST.get("ps_dark",null),bal:0,orders:[],tops:[],tg:[],wa:[],kind:"tg",meth:"UPI",amt:100,bot:"",ready:false};
let C=[];
const flag=c=>/^[A-Za-z]{2}$/.test(c||"")?String.fromCodePoint(...[...c.toUpperCase()].map(x=>127397+x.charCodeAt(0))):"🌍";
const botUrl=()=>"https://t.me/"+S.bot;
const f=n=>S.cur==="INR"?"₹"+n.toFixed(2):"$"+(n/RATE).toFixed(2);
const f2=n=>S.cur==="INR"?"$"+(n/RATE).toFixed(2):"₹"+n.toFixed(2);
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',buy:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 7H6"/>',recharge:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/>',orders:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
const TABS=[["home","Home"],["buy","Buy"],["recharge","Recharge"],["orders","Orders"],["settings","Settings"]];
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2400)}
function theme(){const r=document.documentElement;S.dark===null?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.dark?"dark":"light")}
const isDark=()=>S.dark===null?matchMedia("(prefers-color-scheme: dark)").matches:S.dark;
const cardC=c=>{const[n0,k,d,p,s,iso]=c;const n=n0===n0.toLowerCase()?n0.replace(/\b\w/g,x=>x.toUpperCase()):n0;return `<div class="card cn"><div class="fl">${flag(iso||k)}</div><div class="nm">${n}</div><div class="mut">${k} · ${d}</div>`+(s?`<div class="pr">${f(p)}</div><div class="mut ok">${s} in stock</div><button class="btn sm" data-buy="${k}">Buy now</button>`:`<div class="pr bad">Unavailable</div><div class="mut">Out of stock</div><button class="btn sm" disabled>Buy now</button>`)+`</div>`};
const V={
home(){const n=S.user.name;return `<div class="top"><div class="logo">P</div><b>Prime Store</b><span class="sp"></span><button class="ic" data-go="settings" aria-label="Settings">⚙</button></div>
<div class="hi"><span class="mut">Welcome back,</span><h1>${n}</h1></div><br>
<div class="card"><b>Prime Store</b><div class="mut">Fast and secure account buying. Pick a country to see live stock and price.</div></div>
<div class="card hero"><span class="mut">Total balance</span><div class="big" id="bal">${f(S.bal)}</div><div class="mut" style="margin:-8px 0 12px">${f2(S.bal)}</div><button class="btn" data-go="recharge">+ Add balance</button></div>
<div class="g2"><div class="card stat"><span class="mut">Total recharges</span><b>${S.tops.length}</b></div><div class="card stat"><span class="mut">Total orders</span><b>${S.orders.length}</b></div></div>
<div class="g2 tiles"><div class="card sq" data-smm="1"><span class="em">🚀</span><div><b>Social Media Services</b><span class="mut">Followers, likes, views and more</span></div></div><div class="card sq alt" data-go="orders"><span class="em">📦</span><div><b>My Orders</b><span class="mut">${S.orders.length} total · track status</span></div></div></div>
<div class="row"><h3>Available countries</h3><a data-go="buy">View all</a></div>
<div class="g2">${C.slice(0,4).map(cardC).join("")}</div>`},
buy(){return `<h2 style="margin:6px 2px 14px">Buy accounts</h2><div class="chips"><span data-k="tg" class="${S.kind==="tg"?"on":""}">Telegram</span><span data-k="wa" class="${S.kind==="wa"?"on":""}">WhatsApp</span></div><input id="q" placeholder="Search country" autocomplete="off"><br><br><div class="g2" id="cg">${C.map(cardC).join("")}</div>`},
recharge(){const c=CF(),on=PM.filter(m=>(c[m[4]]||{}).on);
return `<h2 style="margin:6px 2px 14px">Recharge balance</h2><div class="card"><span class="mut">Current balance</span><div class="big" style="font-size:30px;margin-bottom:0">${f(S.bal)}</div></div>`
+(c.top&&c.top.maint?'<div class="card mut" style="text-align:center">Recharge is under maintenance. Please try again later.</div>':on.length?on.map(m=>`<div class="card meth" data-pm="${m[0]}"><span class="mi">${m[1]}</span><div><b>${m[2]}</b><span class="mut">${m[3]}</span></div><span style="font-size:26px;color:var(--mut)">›</span></div>`).join(""):'<div class="card mut" style="text-align:center">No payment method is set up yet. Please contact support.</div>')
+`<div class="row"><h3>Recharge history</h3><a id="rf">Refresh</a></div><div class="card" id="hist"><div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div></div>`},
orders(){return `<h2 style="margin:6px 2px 14px">Orders</h2><div class="card">`+(S.orders.length?S.orders.map(o=>`<div class="item ord" data-ord="${o.k}:${o.i}"><span class="fl" style="font-size:28px">${o.fl}</span><div><b>${esc(o.n)}</b><small>${esc(o.id)} · ${new Date(o.t).toLocaleString()}</small></div><div style="text-align:right;flex:none"><b>${f(o.p)}</b><small class="${o.s==="Completed"?"ok":""}">${esc(o.s)}</small></div><span class="ch">›</span></div>`).join(""):`<div class="mut" style="text-align:center;padding:18px 0">No orders yet. Pick a country in Buy to place your first order.</div><button class="btn" data-go="buy">Go to Buy</button>`)+`</div>`},
settings(){return `<h2 style="margin:6px 2px 14px">Settings</h2><div class="card">
<div class="set" data-s="bot"><span>🤖</span><div><b>Bot connect</b><small>Telegram ID ${S.user.id} · same wallet as the bot</small></div><span class="tag ok">Live</span></div>
<div class="set"><span>💱</span><div><b>Currency</b><small>Choose display currency</small></div><select id="cur"><option value="INR" ${S.cur==="INR"?"selected":""}>₹ INR</option><option value="USDT" ${S.cur==="USDT"?"selected":""}>$ USDT</option></select></div>
<div class="set" data-s="dark"><span>🌙</span><div><b>Dark mode</b><small>Easy on the eyes at night</small></div><span class="sw ${isDark()?"on":""}"></span></div>
<div class="set" data-s="ch"><span>📣</span><div><b>Telegram channel</b><small>Updates and offers</small></div></div>
<div class="set" data-s="sup"><span>🎧</span><div><b>Contact support</b><small>Message us on Telegram</small></div></div>
<div class="set" data-s="out"><span>🚪</span><div><b>Log out</b><small>Sign out from this device</small></div></div></div>`},
login(){return `<div class="lg"><div class="logo">P</div><h1>Prime Store</h1><div class="mut" style="text-align:center">Telegram account store</div><div class="card" style="margin-top:20px"><div class="tabs"><span class="on">Telegram</span><span>Email</span><span>Phone</span></div><button class="btn" id="tg">Continue with Telegram</button><div class="mut" id="lmsg" style="text-align:center;margin:12px 0">The bot will send you your ID and password.</div><div class="mut" style="text-align:center">or log in with your ID and password</div><input id="uid" inputmode="numeric" placeholder="Telegram user ID" style="margin:10px 0"><input id="upw" type="password" placeholder="Password" autocomplete="current-password" style="margin-bottom:10px"><button class="btn ghost" id="go">Log in</button></div></div>`}};
function stagger(){[...$("#app .view,#app").children].forEach((e,i)=>e.style.setProperty("--i",i))}
function countUp(){const e=$("#bal");if(!e)return;const t=S.bal,t0=performance.now();(function s(n){const p=Math.min((n-t0)/900,1),v=t*(1-Math.pow(1-p,3));e.textContent=f(v);if(p<1)requestAnimationFrame(s)})(t0)}
function render(){const a=$("#app"),n=$("#nav");theme();
if(!S.user){n.hidden=true;a.innerHTML=`<div class="view">${V.login()}</div>`;stagger();return}
if(S.sub){n.hidden=true;a.innerHTML=`<div class="view">${V[S.sub]()}</div>`;stagger();if(S.sub==="smm")smmCalc();if(S.sub==="pay")payInit();return}
n.hidden=false;n.innerHTML=`<i style="transform:translateX(${TABS.findIndex(t=>t[0]===S.tab)*100}%)"></i>`+TABS.map(t=>`<button data-go="${t[0]}" class="${S.tab===t[0]?"on":""}"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join("");
a.innerHTML=`<div class="view">${V[S.tab]()}</div>`;stagger();
if(S.tab==="home")countUp();if(S.tab==="recharge")loadHist()}
function loadHist(){clearTimeout(loadHist.t);loadHist.t=setTimeout(()=>{const h=$("#hist");if(!h)return;h.innerHTML=S.tops.length?S.tops.map(t=>`<div class="item"><span>💰</span><div><b>${f(t.a)}</b><small>${esc(t.how||"UPI")} · ${esc(t.id||"")} · ${new Date(t.t).toLocaleString()}</small></div><span class="tag ok">${esc(t.s)}</span></div>`).join(""):`<div class="mut" style="text-align:center">No recharges yet. Add your first balance above.</div>`},900)}
function go(t){const was=S.sub;S.sub=null;if(t===S.tab&&S.user&&!was)return;S.tab=t;render();scrollTo({top:0})}
function sheet(h){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sheet">${h}</div>`;o.onclick=e=>{if(e.target===o||e.target.dataset.x!==undefined)o.remove()};document.body.appendChild(o);return o}
function buy(k){if(S.kind==="tg")return openBuyTg(k);toast("Opening the bot to complete your order");setTimeout(()=>open(botUrl(),"_blank"),600)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-buy],[data-m],[data-a],[data-s],[data-k],#tg,#go,#pay,#rf");if(!t)return;
if(t.dataset.go)return go(t.dataset.go);
if(t.dataset.k){S.kind=t.dataset.k;C=S.kind==="wa"?S.wa:S.tg;return render()}
if(t.dataset.buy)return buy(t.dataset.buy);
if(t.dataset.m){S.meth=t.dataset.m;document.querySelectorAll(".meth").forEach(x=>x.classList.toggle("on",x.dataset.m===S.meth));return}
if(t.dataset.a){$("#amt").value=t.dataset.a;S.amt=+t.dataset.a;$("#pa").textContent=S.amt;return}
if(t.id==="rf"){$("#hist").innerHTML='<div class="sk"></div><div class="sk" style="width:70%"></div>';return loadHist()}
if(t.id==="tg")return tgLogin();
if(t.id==="go")return pwLogin();
if(t.id==="pay"){toast("Opening the bot to add balance");setTimeout(()=>open(botUrl(),"_blank"),600);return}
const s=t.dataset.s;if(s==="dark"){S.dark=!isDark();ST.set("ps_dark",S.dark);theme();t.querySelector(".sw").classList.toggle("on",S.dark)}
else if(s==="out"){fetch("/api/auth",{method:"DELETE"}).finally(()=>{S.user=null;render()})}
else if(s==="bot")open(botUrl(),"_blank");
else if(s)toast("Link will be added soon")});
document.addEventListener("input",e=>{if(e.target.id==="q"){const q=e.target.value.toLowerCase();const r=C.filter(c=>c[0].toLowerCase().includes(q)||c[1].toLowerCase()===q);$("#cg").innerHTML=r.length?r.map(cardC).join(""):'<div class="mut" style="grid-column:1/-1;text-align:center">No country found. Try another name.</div>'}
if(e.target.id==="amt"){S.amt=+e.target.value||0;$("#pa").textContent=S.amt}});
document.addEventListener("change",e=>{if(e.target.id==="cur"){S.cur=e.target.value;ST.set("ps_cur",S.cur);toast("Currency changed to "+S.cur);render()}});
let poll;
const api=b=>fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong");return d});
const msg=t=>{const m=$("#lmsg");if(m)m.textContent=t};
async function tgLogin(){const bt=$("#tg");bt.disabled=true;msg("Opening the bot…");try{const d=await api({action:"start"});open(d.link,"_blank");const m=$("#lmsg");if(m){m.textContent="";const a=document.createElement("a");a.href=d.link;a.target="_blank";a.rel="noopener";a.textContent="Tap here if Telegram did not open";a.style.color="var(--pri)";m.append("Tap Start in the bot and you will be logged in here automatically. ",a)}
clearInterval(poll);const end=Date.now()+3e5;poll=setInterval(async()=>{if(Date.now()>end){clearInterval(poll);bt.disabled=false;return msg("Link expired. Please try again.")}try{const r=await api({action:"poll",tok:d.tok,sec:d.sec});if(r.ok){clearInterval(poll);await boot()}}catch(e){clearInterval(poll);bt.disabled=false;msg(e.message)}},2000)}catch(e){bt.disabled=false;msg(e.message)}}
async function pwLogin(){const id=($("#uid").value||"").replace(/\D/g,""),pw=$("#upw").value;if(!id||!pw)return msg("Enter your ID and password");try{await api({action:"password",id,password:pw});await boot()}catch(e){msg(e.message)}}
async function boot(){try{const r=await fetch("/api/data");const d=await r.json();S.bot=d.bot||S.bot;if(r.ok){S.user=d.user;S.bal=d.balance;S.tg=d.tg;S.wa=d.wa;C=S.kind==="wa"?S.wa:S.tg;S.orders=d.orders;S.tops=d.topups;S.plats=d.plats||[];S.cfg=d.cfg||{}}else if(r.status===401){S.user=null}else throw 0}catch(e){toast("Could not load data. Please refresh.")}S.ready=true;render()}
/* ---------- Social media services: full pages (form with Platform / Service selectors), order details ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SM={plat:null,plabel:"",cat:null,svc:null,list:null,cache:{},pick:null,q:"",link:"",qty:"",res:null,busy:false,err:"",loading:false};
const smCost=(s,q)=>Math.max(1,Math.ceil(+(s.r*q/1000*100).toFixed(6))); // paise, same formula as the bot
const smQ=()=>parseInt(String(SM.qty).replace(/,/g,""),10);
const cats=L=>{const m=new Map();L.forEach(s=>{const c=s.c||"All services";m.set(c,(m.get(c)||0)+1)});return[...m]};
const inCat=()=>SM.list||[];
const SKEL='<div class="card"><div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div></div>';
const none=t=>`<div class="mut" style="text-align:center;padding:18px 0">${t}</div>`;
const act=b=>fetch("/api/act",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong");return d});
const clip=t=>{try{navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>toast("Could not copy"))}catch(e){toast("Could not copy")}};
const cpb=t=>`<button class="cp" data-cp="${esc(t)}">Copy</button>`;
async function reload(){try{const r=await fetch("/api/data");if(!r.ok)return;const d=await r.json();S.bal=d.balance;S.orders=d.orders;S.tops=d.topups;S.plats=d.plats||[];S.cfg=d.cfg||{};if(!S.sub&&S.tab!=="recharge")render()}catch(e){}}
async function jobWait(id){const end=Date.now()+105e3;while(Date.now()<end){await new Promise(r=>setTimeout(r,1500));try{const r=await act({action:"job",id});if(["done","error","checking","expired"].includes(r.status))return r}catch(e){}}return{status:"checking",error:"We could not confirm it yet. Please check your Orders before trying again."}}
const topBar=(t,back)=>`<div class="top"><button class="ic" data-pb="${back}" aria-label="Back">←</button><b>${t}</b></div>`;

function smmOpen(){Object.assign(SM,{plat:null,plabel:"",cat:null,svc:null,list:null,cache:{},pick:null,q:"",link:"",qty:"",res:null,busy:false,err:"",loading:false});S.sub="smm";render();scrollTo({top:0})}
function pickRows(){const k=SM.pick,q=(SM.q||"").toLowerCase().trim();
if(k==="plat"){const P=S.plats||[];return P.length?P.map(p=>`<div class="sel ${SM.plat===p[0]?"on":""}" data-sp="${esc(p[0])}"><div><b>${esc(p[1])}</b><small>${p[2]} services</small></div><span class="ch">›</span></div>`).join(""):none("No services are available right now. Please check back soon.")}
const L=inCat().filter(s=>!q||s.n.toLowerCase().includes(q)||String(s.id)===q);
return L.length?L.slice(0,100).map(s=>`<div class="sel ${SM.svc&&SM.svc.id===s.id?"on":""}" data-ss="${s.id}"><div><b>${esc(s.n)}</b><small>${f(s.r)} per 1,000 · Min ${s.lo} · Max ${s.hi}</small></div><span class="ch">›</span></div>`).join("")+(L.length>100?none("Showing 100 of "+L.length+". Search to narrow it down."):""):none("No service found.")}
function pickView(){const t={plat:"Choose platform",svc:"Choose service"}[SM.pick];
return topBar(t,"pick")+(SM.pick==="plat"?"":`<input id="psq" placeholder="Search" autocomplete="off" value="${esc(SM.q)}" style="margin-bottom:12px">`)+`<div class="card" style="padding:4px 16px" id="pl">${pickRows()}</div>`}
function formView(){const s=SM.svc,q=smQ();
return topBar("Social media services","exit")+`<div class="card" style="padding:4px 16px">
<div class="sel" data-pick="plat"><div><small>Platform</small><b>${SM.plat?esc(SM.plabel):"Select platform"}</b></div><span class="ch">›</span></div>
<div class="sel ${SM.plat&&SM.list?"":"dis"}" data-pick="svc"><div><small>Service</small><b>${s?esc(s.n):"Select service"}</b></div><span class="ch">›</span></div></div>`
+(SM.loading?SKEL:s?`<div class="card" style="padding:4px 16px"><div class="kv"><span>Rate</span><b>${f(s.r)} per 1,000</b></div><div class="kv"><span>Min / Max</span><b>${s.lo} / ${s.hi}</b></div><div class="kv"><span>Refill</span><b>${s.rf?"Yes":"No"}</b></div></div>
<div class="card"><span class="mut">Link</span><input id="sl" placeholder="https://… or @username" autocomplete="off" autocapitalize="off" value="${esc(SM.link)}" ${SM.busy?"disabled":""} style="margin:6px 0 12px"><span class="mut">Quantity</span><input id="sn" type="number" inputmode="numeric" placeholder="${s.lo} to ${s.hi}" value="${esc(SM.qty)}" ${SM.busy?"disabled":""} style="margin:6px 0 4px"><div class="tot"><span>Total</span><span id="stot">${f(q>=s.lo&&q<=s.hi?smCost(s,q)/100:0)}</span></div><div class="mut" style="margin:0 2px">Balance: ${f(S.bal)}</div><div class="err" id="serr">${esc(SM.err)}</div><button class="btn" id="sgo" ${SM.busy?"disabled":""}>${SM.busy?"Placing order…":"Place order"}</button></div>`
:none("Pick a platform, category and service to continue."))}
function resView(){const r=SM.res,ok=r.status==="done";
return topBar(ok?"Order placed":"Order is being checked","exit")+`<div style="text-align:center;font-size:56px;padding:6px 0 14px">${ok?"✅":"⏳"}</div><div class="card" style="padding:4px 16px"><div class="kv"><span>Service</span><b>${esc(r.name)}</b></div><div class="kv"><span>Quantity</span><b>${r.qty}</b></div><div class="kv"><span>Charged</span><b>${f(r.cost)}</b></div><div class="kv"><span>Order ID</span><b>${esc(r.oid)}${cpb(r.oid)}</b></div></div>`
+(ok?"":`<div class="card mut">${esc(r.error||"We are confirming this order. Please do not order again. You will get the result in your Orders and on Telegram.")}</div>`)
+(r.rid?`<button class="btn" data-ord="smm:${r.rid}">View order details</button>`:`<button class="btn" data-pb="orders">View orders</button>`)+`<button class="btn ghost sm" data-pb="again">Order more</button>`}
V.smm=()=>SM.res?resView():SM.pick?pickView():formView();

async function pickPlat(k){const p=(S.plats||[]).find(x=>x[0]===k);Object.assign(SM,{plat:k,plabel:p?p[1]:k,cat:null,svc:null,pick:null,q:"",err:"",list:SM.cache[k]||null});
if(!SM.list){SM.loading=true;render();try{const r=await fetch("/api/data?plat="+encodeURIComponent(k));if(!r.ok)throw 0;const d=await r.json();SM.cache[k]=d.services||[];if(SM.plat!==k)return;SM.list=SM.cache[k]}catch(e){Object.assign(SM,{plat:null,plabel:"",loading:false});toast("Could not load services. Please try again.");return render()}SM.loading=false}
SM.pick="svc";render();scrollTo({top:0})}
function smmCalc(){const s=SM.svc;if(S.sub!=="smm"||SM.pick||SM.res||!s||!$("#stot"))return;const q=smQ(),ok=q>=s.lo&&q<=s.hi,c=ok?smCost(s,q)/100:0,g=$("#sgo"),e=$("#serr");
$("#stot").textContent=f(c);if(ok&&c>S.bal){e.textContent="You need "+f(c-S.bal)+" more.";g.textContent="Add funds";g.dataset.fund="1"}else{if(e.textContent.startsWith("You need"))e.textContent="";g.textContent=SM.busy?"Placing order…":"Place order";delete g.dataset.fund}}
async function smmPlace(){const s=SM.svc,link=SM.link.trim(),q=smQ(),e=$("#serr");
if(!link){e.textContent="Enter the link for this order.";return}
if(!(q>=s.lo&&q<=s.hi)){e.textContent="Enter a quantity between "+s.lo+" and "+s.hi+".";return}
SM.busy=true;SM.err="";render();
try{const d=await act({action:"smm",service_id:s.id,link,qty:q,cost:smCost(s,q)});const r=await jobWait(d.id);SM.busy=false;
if(S.sub!=="smm"){toast(r.status==="done"?"Order placed ✅":(r.error||"Your order is being checked"));return reload()}
if(r.status==="error"||r.status==="expired"){SM.err=r.error||"Could not place the order.";render();return reload()}
SM.res=r;render();scrollTo({top:0});reload()}
catch(err){SM.busy=false;SM.err=err.message;if(S.sub==="smm")render()}}

/* order details page (like the status page in the bot) */
const ICON={Received:"✅",Bought:"📱",Failed:"❌"};
const sIcon=(k,st)=>{const l=String(st||"").toLowerCase();if(k==="smm")return l==="completed"?"✅":["canceled","cancelled","refunded","fail","failed","rejected"].includes(l)?"❌":l==="partial"?"⚠️":"⏳";return ICON[st]||"⏳"};
const kv=(a,b,c)=>b===""||b==null?"":`<div class="kv"><span>${a}</span><b>${b}${c||""}</b></div>`;
V.order=()=>{const d=S.od,t=topBar("Order details","orders");if(!d)return t+SKEL;if(d.err)return t+`<div class="card bad" style="text-align:center">${esc(d.err)}</div>`;
const when=new Date(d.created).toLocaleString(),b=S.odb?"disabled":"";
const head=`<div style="text-align:center;font-size:52px;padding:4px 0 2px">${sIcon(d.k,d.status)}</div><h2 style="text-align:center;margin-bottom:14px">${d.k==="smm"?"Order status":d.k==="wa"?"WhatsApp order":"Number order"}</h2>`;
if(d.k==="smm")return t+head+`<div class="card" style="padding:4px 16px">${kv("Service",esc(d.name))}${kv("Platform",esc(d.plat))}${kv("Status",esc(d.status),"")}${kv("Quantity",d.qty)}${kv("Charged",f(d.cost))}${kv("Start",esc(d.start||"—"))}${kv("Remains",d.remains)}${kv("Refunded",d.refunded?"Yes · "+f(d.refunded):"No")}</div>
<div class="card" style="padding:4px 16px">${kv("Order ID",esc(d.oid),cpb(d.oid))}${kv("Placed",esc(when))}${kv("Link",esc((d.link||"").slice(0,70)),d.link?cpb(d.link):"")}</div>
<div class="card mut">ℹ️ ${esc(d.note)}</div>${d.canRefill?`<button class="btn" id="odl" ${b}>🔁 Request refill</button>`:""}<button class="btn ${d.canRefill?"ghost sm":""}" id="odr" ${b}>🔄 Refresh</button>`;
return t+head+`<div class="card" style="padding:4px 16px">${kv("Order ID",esc(d.oid),cpb(d.oid))}${kv("Country",esc(d.name))}${kv("Number",esc(d.number),d.number?cpb(d.number):"")}${kv("Line",esc(d.op))}${kv("Paid",f(d.cost))}${kv("Status",esc(d.status))}${kv("Placed",esc(when))}${kv("Code",esc(d.code),d.code?cpb(d.code):"")}${kv("Password",esc(d.pass),d.pass?cpb(d.pass):"")}${d.refunded?kv("Refunded",f(d.refunded)):""}</div>${d.note?`<div class="card mut">ℹ️ ${esc(d.note)}</div>`:""}${d.canCode?`<button class="btn" id="odc" ${b}>📩 Get code</button>`:""}<button class="btn ${d.canCode?"ghost sm":""}" id="odr" ${b}>🔄 Refresh</button>`};
async function getOrder(k,i){const r=await fetch("/api/data?order="+k+":"+i);const d=await r.json().catch(()=>({}));return r.ok?d:{err:d.error||"Order not found"}}
async function openOrder(k,i){S.sub="order";S.od=null;S.odb=false;render();scrollTo({top:0});try{S.od=await getOrder(k,i)}catch(e){S.od={err:"Could not load. Please try again."}}if(S.sub==="order")render()}
async function odAction(kind){const d=S.od;if(!d||S.odb)return;S.odb=true;render();
try{if(kind==="code"){const j=await act({action:"tg_code",rid:d.rid});const r=await jobWait(j.id);toast(r.status==="done"?"✅ Code received":(r.error||"Please try again"))}else if(d.k==="smm"&&(kind==="refill"||d.canRefresh)){const j=await act({action:kind==="refill"?"refill":"refresh",rid:d.rid});const r=await jobWait(j.id);toast(r.status==="done"?(r.note||"Updated"):(r.error||"Please try again"))}else toast("Updated");
S.od=await getOrder(d.k,d.rid)}catch(e){toast(e.message||"Please try again")}S.odb=false;if(S.sub==="order")render();reload()}

document.addEventListener("click",e=>{const t=e.target.closest("[data-smm],[data-pick],[data-sp],[data-sc],[data-ss],[data-pb],[data-ord],[data-cp],#sgo,#odr,#odl");if(!t)return;
if(t.dataset.cp!==undefined)return clip(t.dataset.cp);
if(t.dataset.smm!==undefined)return smmOpen();
if(t.dataset.ord!==undefined){const[k,i]=t.dataset.ord.split(":");return openOrder(k,i)}
if(t.id==="odr")return odAction("refresh");if(t.id==="odl")return odAction("refill");
if(t.id==="sgo"){if(t.dataset.fund){S.sub=null;return go("recharge")}return smmPlace()}
if(t.dataset.pick!==undefined){SM.pick=t.dataset.pick;SM.q="";render();return scrollTo({top:0})}
if(t.dataset.pb!==undefined){const v=t.dataset.pb;if(v==="pick"){SM.pick=null;return render()}if(v==="again")return smmOpen();
if(v==="paydone"){clearInterval(PY.t);S.sub=null;S.tab="recharge";render();return scrollTo({top:0})}
if(v==="payback"){if(PY.step==="pay"&&PY.m!=="bpay"&&!PY.res){clearInterval(PY.t);PY.step="amt";PY.err="";PY.inv=null;return render()}clearInterval(PY.t);S.sub=null;S.tab="recharge";render();return scrollTo({top:0})}if(v==="orders"){S.sub=null;S.tab="orders";render();return scrollTo({top:0})}S.sub=null;render();return scrollTo({top:0})}
if(t.dataset.sp!==undefined)return pickPlat(t.dataset.sp);
if(t.dataset.ss!==undefined){const s=(SM.list||[]).find(x=>String(x.id)===t.dataset.ss);if(s){SM.svc=s;SM.pick=null;render();scrollTo({top:0})}}});
document.addEventListener("input",e=>{const i=e.target.id;if(i==="psq"){SM.q=e.target.value;$("#pl").innerHTML=pickRows()}else if(i==="sl")SM.link=e.target.value;else if(i==="sn"){SM.qty=e.target.value;smmCalc()}});

/* ---------- Buy Telegram number (full pages) ---------- */
const TB={c:null,busy:false,err:"",res:null};
function openBuyTg(code){const c=(S.tg||[]).find(x=>x[1]===code);if(!c)return;if(S.cfg&&S.cfg.tg&&S.cfg.tg.maint)return toast("This server is under maintenance. Please try again later.");Object.assign(TB,{c,busy:false,err:"",res:null});S.sub="buytg";render();scrollTo({top:0})}
V.buytg=()=>{const r=TB.res;if(r){const ok=r.status==="done",o=r.out||{};
return topBar(ok?"Number ready":"Order is being checked","exit")+`<div style="text-align:center;font-size:56px;padding:6px 0 14px">${ok?"✅":"⏳"}</div>`+(ok?`<div class="card" style="padding:4px 16px">${kv("Country",esc(o.name))}${kv("Number",esc(o.number),cpb(o.number))}${kv("Paid",f(o.cost/100))}</div><div class="card mut">1️⃣ Open Telegram and log in with this number<br>2️⃣ When Telegram sends the code, tap <b>Get code</b> below</div><div class="err" id="tgerr">${esc(TB.err)}</div><button class="btn" id="tgc" ${TB.busy?"disabled":""}>${TB.busy?"Checking…":"📩 Get code"}</button><button class="btn ghost sm" data-ord="num:${o.rid}">View order details</button>`:`<div class="card mut">${esc(r.error||"We are confirming this order. Please do not buy again. You will get a message soon.")}</div><button class="btn" data-pb="orders">View orders</button>`)}
const c=TB.c,cost=c[3],need=cost-S.bal,low=need>0;
return topBar("Order confirmation","exit")+`<div class="card" style="padding:4px 16px">${kv("App","Telegram")}${kv("Region",flag(c[5]||c[1])+" "+esc(c[0]))}${kv("Price",f(cost))}${kv("Stock",c[4]+" pcs")}${kv("Balance",f(S.bal))}</div>
<div class="card"><b>📌 How it works</b><div class="mut" style="margin-top:6px">1️⃣ Buy the number<br>2️⃣ Log in to Telegram with it<br>3️⃣ Tap <b>Get code</b> here</div></div>
<div class="card"><b>🚨 Terms</b><div class="mut" style="margin-top:6px">• ✅ No number available? Automatic full refund<br>• 🚫 No refund once the number is delivered<br>• 🔐 Use a fresh device or VPN of the same country</div></div>
<div class="err" id="tgerr">${low?"You need "+f(need)+" more.":esc(TB.err)}</div><button class="btn" id="tgb" ${TB.busy?"disabled":""}>${low?"Add funds":TB.busy?"Getting your number…":"✅ Accept & buy"}</button>`};
async function tgBuy(){const c=TB.c;TB.busy=true;TB.err="";render();
try{const j=await act({action:"tg_buy",code:c[1],cost:Math.round(c[3]*100)});const r=await jobWait(j.id);TB.busy=false;
if(S.sub!=="buytg"){toast(r.status==="done"?"Number ready ✅":(r.error||"Your order is being checked"));return reload()}
if(r.status==="error"||r.status==="expired"){TB.err=r.error||"Could not buy the number.";render();return reload()}
TB.res=r;render();scrollTo({top:0});reload()}
catch(e){TB.busy=false;TB.err=e.message;if(S.sub==="buytg")render()}}
async function tgGetCode(){const o=(TB.res||{}).out||{};TB.busy=true;TB.err="";render();
try{const j=await act({action:"tg_code",rid:o.rid});const r=await jobWait(j.id);TB.busy=false;
if(r.status==="done"){toast("✅ Code received");return openOrder("num",o.rid)}
TB.err=r.error||"Code hasn't arrived yet. Try again in a moment.";if(S.sub==="buytg")render()}
catch(e){TB.busy=false;TB.err=e.message;if(S.sub==="buytg")render()}}

/* ---------- Recharge (UPI / Binance Pay / Crypto) ---------- */
const PM=[["upi","🏦","UPI","Instant top-up, auto verified","upi"],["bpay","🅱️","Binance Pay","Send to Pay ID and verify","bpay"],["cry","🪙","Crypto","Pay with any coin","crypto"]];
const CF=()=>S.cfg||{};
const PY={m:null,step:"amt",amt:0,ref:"",busy:false,err:"",res:null,inv:null,st:"",t:0};
const pcfg=()=>CF()[PM.find(x=>x[0]===PY.m)[4]]||{};
function openPay(m){const c=CF()[PM.find(x=>x[0]===m)[4]]||{};clearInterval(PY.t);Object.assign(PY,{m,step:m==="bpay"?"pay":"amt",amt:(c.presets||[c.min||10])[0],ref:"",busy:false,err:"",res:null,inv:null,st:""});S.sub="pay";render();scrollTo({top:0})}
const upiLink=()=>{const c=pcfg();return `upi://pay?pa=${encodeURIComponent(c.id)}&pn=${encodeURIComponent(c.name||"Store")}&am=${PY.amt}&cu=INR&tn=${encodeURIComponent("W"+((S.user&&S.user.id)||""))}`};
const invText=()=>PY.st==="expired"||PY.st==="failed"?"⌛ This invoice has expired. Nothing was paid, so nothing was charged.":PY.st==="review"?"Your payment is being checked by the owner.":"Waiting for your payment. Your wallet is credited automatically after the network confirms. This page updates by itself.";
const refBox=(ph,btn)=>`<div class="card"><input id="pyr" placeholder="${ph}" autocomplete="off" autocapitalize="off" value="${esc(PY.ref)}" ${PY.busy?"disabled":""} style="margin-bottom:8px"><div class="err" id="pyerr">${esc(PY.err)}</div><button class="btn" id="pygo" ${PY.busy?"disabled":""}>${PY.busy?"Verifying…":btn}</button></div>`;
V.pay=()=>{const m=PY.m,c=pcfg();
if(PY.res)return topBar("Payment successful","paydone")+`<div style="text-align:center;font-size:56px;padding:6px 0 14px">✅</div><div class="card" style="padding:4px 16px">${kv("Added",f(PY.res.amount))}${kv("Balance",f(S.bal))}</div><button class="btn" data-smm="1">🚀 Order now</button><button class="btn ghost sm" data-pb="paydone">Done</button>`;
const T={upi:"UPI · Instant top-up",bpay:"Binance Pay",cry:"Crypto · Auto"}[m],top=topBar(T,"payback");
if(m==="bpay")return top+`<div class="card" style="padding:4px 16px">${kv("Pay ID",esc(c.id),cpb(c.id))}${kv("Coin",esc((c.coins||[]).join("/")))}${kv("Minimum","₹"+c.min)}</div><div class="card mut">1️⃣ Send ${esc((c.coins||[]).join("/"))} to this Pay ID in Binance<br>2️⃣ Enter your Order ID below and tap Verify</div>`+refBox("Binance Pay Order ID","✅ Verify payment");
if(PY.step==="amt")return top+`<div class="card" style="padding:4px 16px">${kv("Minimum","₹"+c.min)}${kv("Balance",f(S.bal))}</div><div class="card"><span class="mut">Amount in ₹</span><input id="pya" type="number" inputmode="numeric" value="${PY.amt}" ${PY.busy?"disabled":""} style="margin:6px 0"><div class="chips">${(c.presets||[]).map(a=>`<span data-pa="${a}">₹${a}</span>`).join("")}</div><div class="err" id="pyerr">${esc(PY.err)}</div><button class="btn" id="pygo" ${PY.busy?"disabled":""}>${m==="upi"?"Continue":PY.busy?"Creating invoice…":"Create invoice"}</button></div>`;
if(m==="upi")return top+`<div class="card" style="text-align:center"><div class="mut">Pay exactly</div><div class="big" style="font-size:34px;margin:4px 0 12px">₹${PY.amt}</div><div id="qr" style="display:inline-block;background:#fff;padding:10px;border-radius:14px"></div></div><div class="card" style="padding:4px 16px">${kv("UPI ID",esc(c.id),cpb(c.id))}${kv("Name",esc(c.name))}${kv("Amount","₹"+PY.amt)}</div><a class="btn" href="${esc(upiLink())}" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px">Open UPI app</a><div class="card mut" style="margin-bottom:0">After paying, enter your 12-digit UTR (or the FamPay transaction ID):</div>`+refBox("UTR or FMPIB… ID","✅ Verify payment");
const v=PY.inv||{};return top+`<div class="card" style="padding:4px 16px">${kv("Pay",v.usd+" USDT")}${kv("You get",f(v.inr))}${kv("Invoice ID",esc(v.track),cpb(v.track))}</div><a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px">💳 Pay now</a><div class="card mut" id="cst">${invText()}</div><div class="err" id="pyerr">${esc(PY.err)}</div><button class="btn ghost sm" id="cyk" ${PY.busy?"disabled":""}>🔄 Check payment</button>`};
function payInit(){const q=$("#qr");if(!q||q.firstChild)return;if(window.QRCode)new QRCode(q,{text:upiLink(),width:190,height:190});else q.remove()}
function payDone(amount){clearInterval(PY.t);PY.res={amount};PY.busy=false;render();scrollTo({top:0});reload().then(()=>{if(S.sub==="pay"&&PY.res)render()})}
function invState(st,inr){if(st==="paid")return payDone(inr);if(st!==PY.st){PY.st=st;const e=$("#cst");if(e)e.textContent=invText()}}
function startInv(){clearInterval(PY.t);PY.t=setInterval(async()=>{if(S.sub!=="pay"||PY.m!=="cry"||!PY.inv||PY.res)return clearInterval(PY.t);try{const r=await fetch("/api/data?inv="+encodeURIComponent(PY.inv.track));if(r.ok){const d=await r.json();invState(d.status,d.inr)}}catch(e){}},6000)}
async function payGo(){const m=PY.m,c=pcfg();PY.err="";
if(m!=="bpay"&&PY.step==="amt"){const a=Math.floor(PY.amt);if(!(a>=c.min&&a<=c.max)){PY.err="Enter an amount between ₹"+c.min+" and ₹"+c.max+".";return render()}PY.amt=a;
if(m==="upi"){PY.step="pay";return render()}
PY.busy=true;render();try{const j=await act({action:"crypto_invoice",inr:a});const r=await jobWait(j.id);PY.busy=false;if(r.status==="done"){PY.inv=r.out;PY.step="pay";PY.st="pending";render();return startInv()}PY.err=r.error||"Could not create the invoice.";render()}catch(e){PY.busy=false;PY.err=e.message;render()}return}
const ref=PY.ref.trim();if(!ref){PY.err="Enter your "+(m==="bpay"?"Order ID.":"UTR.");return render()}
PY.busy=true;render();
try{const j=await act(m==="upi"?{action:"upi_verify",amount:PY.amt,ref}:{action:"bpay_verify",ref});const r=await jobWait(j.id);PY.busy=false;
if(r.status==="done")return payDone((r.out||{}).amount);PY.err=r.error||"Could not verify the payment.";render()}
catch(e){PY.busy=false;PY.err=e.message;render()}}
async function cryCheck(){PY.busy=true;PY.err="";render();try{const j=await act({action:"crypto_check",track:PY.inv.track});const r=await jobWait(j.id);PY.busy=false;const o=r.out||{};
if(r.status==="done"){if(o.st==="paid")return payDone(o.inr);if(o.st==="pending")PY.err="Payment not received yet. If you just paid, wait for the network to confirm.";else PY.st=o.st}else PY.err=r.error||"Couldn't check right now.";render()}catch(e){PY.busy=false;PY.err=e.message;render()}}

document.addEventListener("click",e=>{const t=e.target.closest("[data-pm],[data-pa],#pygo,#cyk,#tgb,#tgc,#odc");if(!t)return;
if(t.dataset.pm!==undefined)return openPay(t.dataset.pm);
if(t.dataset.pa!==undefined){PY.amt=+t.dataset.pa;const i=$("#pya");if(i)i.value=PY.amt;return}
if(t.id==="pygo")return payGo();if(t.id==="cyk")return cryCheck();
if(t.id==="tgb"){if(TB.c[3]>S.bal){S.sub=null;return go("recharge")}return tgBuy()}
if(t.id==="tgc")return tgGetCode();if(t.id==="odc")return odAction("code")});
document.addEventListener("input",e=>{const i=e.target.id;if(i==="pya")PY.amt=+e.target.value;else if(i==="pyr")PY.ref=e.target.value});

boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Store</title>
<style>
:root{--bg1:#F1EEFF;--bg2:#D9CFFF;--ink:#1D1548;--mut:#5f5690;--pri:#6C4DF6;--pri2:#8B73FF;--btn1:#8B73FF;--btn2:#5B3DE0;--btnink:#fff;--card:rgba(255,255,255,.62);--line:rgba(91,61,224,.16);--ok:#16966a;--bad:#d23a62;--sh:0 12px 32px rgba(91,61,224,.18);--blob:#8B73FF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1B1445;--bg2:#0E0A26;--ink:#EDE9FF;--mut:#B4A9E8;--pri:#B7A8FF;--pri2:#8B73FF;--btn1:#8B73FF;--btn2:#5B3DE0;--card:rgba(237,233,255,.07);--line:rgba(237,233,255,.14);--ok:#5bd69b;--bad:#ff7d9d;--sh:0 12px 32px rgba(0,0,0,.5);--blob:#5B3DE0;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1B1445;--bg2:#0E0A26;--ink:#EDE9FF;--mut:#B4A9E8;--pri:#B7A8FF;--pri2:#8B73FF;--btn1:#8B73FF;--btn2:#5B3DE0;--card:rgba(237,233,255,.07);--line:rgba(237,233,255,.14);--ok:#5bd69b;--bad:#ff7d9d;--sh:0 12px 32px rgba(0,0,0,.5);--blob:#5B3DE0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;background:var(--blob);filter:blur(90px);opacity:.35;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
body::before{top:-120px;left:-100px}body::after{bottom:-140px;right:-120px;animation-delay:-9s}
@keyframes drift{to{transform:translate(60px,70px) scale(1.15)}}
#app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--btnink);background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:var(--sh)}
.top b{font-size:17px}.top .sp{flex:1}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.hi h1{font-size:30px;margin-top:2px}
.btn{width:100%;border:0;border-radius:18px;padding:14px;font:700 15px inherit;font-family:inherit;color:var(--btnink);background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 8px 20px rgba(108,77,246,.38);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.45;box-shadow:none}
.btn.sm{padding:9px;font-size:13px;border-radius:14px;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.big{font-size:38px;font-weight:800;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2 .card{margin:0}
.stat b{display:block;font-size:24px;margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.row a{color:var(--pri);font-size:13px;font-weight:700;cursor:pointer}
.cn{text-align:center;padding:14px 10px;transition:transform .2s}
.cn:active{transform:scale(.97)}
.fl{font-size:34px;line-height:1.1}
.cn .nm{font-weight:700;margin-top:4px}
.pr{font-size:20px;font-weight:800;margin:6px 0 0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--ink)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
input,select{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(108,77,246,.28)}
input::placeholder{color:var(--mut);opacity:.8}
.meth{display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid transparent;transition:border-color .2s,transform .15s}
.meth:active{transform:scale(.98)}.meth.on{border-color:var(--pri2)}
.meth .mi{font-size:26px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--line)}
.meth div{flex:1}.meth b{display:block}
.chips{display:flex;gap:8px;margin:10px 0}
.chips span{flex:1;text-align:center;padding:8px;border-radius:14px;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:13px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item div{flex:1}.item small{display:block;color:var(--mut)}
.sk{height:14px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,var(--line),rgba(255,255,255,.35),var(--line));background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.set:last-child{border:0}.set div{flex:1}.set small{display:block;color:var(--mut);font-size:12px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:var(--pri2)}.sw.on::after{transform:translateX(20px)}
select{width:auto;padding:8px 10px;border-radius:12px}
nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(456px,calc(100% - 24px));display:flex;padding:6px;border-radius:30px;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:var(--sh);z-index:5}
nav i{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:24px;background:linear-gradient(135deg,var(--btn1),var(--btn2));transition:transform .45s cubic-bezier(.3,1.25,.5,1);box-shadow:0 6px 16px rgba(108,77,246,.45)}
nav button{flex:1;position:relative;border:0;background:none;color:var(--mut);padding:8px 0 6px;font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .3s}
nav button.on{color:var(--btnink)}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-80px);background:var(--ink);color:var(--bg1);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;transition:transform .4s cubic-bezier(.3,1.3,.5,1);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(18,12,48,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:min(480px,100%);background:var(--bg1);color:var(--ink);border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{transform:translateY(100%)}}
.sheet p{display:flex;justify-content:space-between;margin:8px 0}
.lg{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center}
.lg .logo{width:84px;height:84px;font-size:36px;margin:0 auto 14px;animation:pop .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.lg h1{text-align:center;font-size:28px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs span{flex:1;text-align:center;padding:9px 4px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--line);opacity:.55}
.tabs span.on{opacity:1;background:var(--card);border-color:var(--pri2)}
.hero{background:linear-gradient(135deg,#8B73FF,#5B3DE0 72%);color:#fff;border:0;position:relative;overflow:hidden;box-shadow:0 16px 36px rgba(91,61,224,.42)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.14);animation:drift 12s ease-in-out infinite alternate}
.hero>*{position:relative;z-index:1}
.hero .mut{color:rgba(255,255,255,.8)}
.hero .btn{background:#fff;color:#4a2fd0;box-shadow:none}
.cn .fl{width:60px;height:60px;margin:0 auto 6px;display:grid;place-items:center;border-radius:50%;background:var(--line);font-size:32px}
.cn{background:linear-gradient(180deg,var(--card),transparent 140%)}
.chips span.on{border-color:var(--pri2);background:var(--card)}
.tiles{margin-top:14px}
.sq{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;padding:16px;transition:transform .2s}
.sq:active{transform:scale(.97)}
.sq .em{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 8px 20px rgba(108,77,246,.38)}
.sq.alt .em{background:var(--line);box-shadow:none}
.sq b{display:block;font-size:17px;line-height:1.2}
.sq .mut{display:block;margin-top:4px}
.sheet.tall{max-height:88vh;overflow-y:auto;overscroll-behavior:contain}
.sx{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sx h3{flex:1;font-size:18px}
.svr{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.svr:last-child{border:0}.svr b{display:block}.svr small{color:var(--mut)}
.tot{display:flex;justify-content:space-between;margin:12px 2px 4px;font-weight:700}
.err{color:var(--bad);font-size:13px;margin:8px 2px;min-height:18px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),RATE=90;
const ST={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={user:null,tab:"home",cur:ST.get("ps_cur","INR"),dark:ST.get("ps_dark",null),bal:0,orders:[],tops:[],tg:[],wa:[],kind:"tg",meth:"UPI",amt:100,bot:"",ready:false};
let C=[];
const flag=c=>/^[A-Za-z]{2}$/.test(c||"")?String.fromCodePoint(...[...c.toUpperCase()].map(x=>127397+x.charCodeAt(0))):"🌍";
const botUrl=()=>"https://t.me/"+S.bot;
const f=n=>S.cur==="INR"?"₹"+n.toFixed(2):"$"+(n/RATE).toFixed(2);
const f2=n=>S.cur==="INR"?"$"+(n/RATE).toFixed(2):"₹"+n.toFixed(2);
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',buy:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 7H6"/>',recharge:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/>',orders:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
const TABS=[["home","Home"],["buy","Buy"],["recharge","Recharge"],["orders","Orders"],["settings","Settings"]];
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2400)}
function theme(){const r=document.documentElement;S.dark===null?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.dark?"dark":"light")}
const isDark=()=>S.dark===null?matchMedia("(prefers-color-scheme: dark)").matches:S.dark;
const cardC=c=>{const[n,k,d,p,s]=c;return `<div class="card cn"><div class="fl">${flag(k)}</div><div class="nm">${n}</div><div class="mut">${k} · ${d}</div>`+(s?`<div class="pr">${f(p)}</div><div class="mut ok">${s} in stock</div><button class="btn sm" data-buy="${k}">Buy now</button>`:`<div class="pr bad">Unavailable</div><div class="mut">Out of stock</div><button class="btn sm" disabled>Buy now</button>`)+`</div>`};
const V={
home(){const n=S.user.name;return `<div class="top"><div class="logo">P</div><b>Prime Store</b><span class="sp"></span><button class="ic" data-go="settings" aria-label="Settings">⚙</button></div>
<div class="hi"><span class="mut">Welcome back,</span><h1>${n}</h1></div><br>
<div class="card"><b>Prime Store</b><div class="mut">Fast and secure account buying. Pick a country to see live stock and price.</div></div>
<div class="card hero"><span class="mut">Total balance</span><div class="big" id="bal">${f(S.bal)}</div><div class="mut" style="margin:-8px 0 12px">${f2(S.bal)}</div><button class="btn" data-go="recharge">+ Add balance</button></div>
<div class="g2"><div class="card stat"><span class="mut">Total recharges</span><b>${S.tops.length}</b></div><div class="card stat"><span class="mut">Total orders</span><b>${S.orders.length}</b></div></div>
<div class="g2 tiles"><div class="card sq" data-smm="1"><span class="em">🚀</span><div><b>Social Media Services</b><span class="mut">Followers, likes, views and more</span></div></div><div class="card sq alt" data-go="orders"><span class="em">📦</span><div><b>My Orders</b><span class="mut">${S.orders.length} total · track status</span></div></div></div>
<div class="row"><h3>Available countries</h3><a data-go="buy">View all</a></div>
<div class="g2">${C.slice(0,4).map(cardC).join("")}</div>`},
buy(){return `<h2 style="margin:6px 2px 14px">Buy accounts</h2><div class="chips"><span data-k="tg" class="${S.kind==="tg"?"on":""}">Telegram</span><span data-k="wa" class="${S.kind==="wa"?"on":""}">WhatsApp</span></div><input id="q" placeholder="Search country" autocomplete="off"><br><br><div class="g2" id="cg">${C.map(cardC).join("")}</div>`},
recharge(){const M=[["UPI","🏦","UPI gateway","Scan QR and pay, auto verified"],["BNB","🪙","Binance Pay","Send to Pay ID and verify"],["CRY","💎","Crypto","USDT via OxaPay"]];
return `<h2 style="margin:6px 2px 14px">Recharge balance</h2><div class="card"><span class="mut">Current balance</span><div class="big" style="font-size:30px;margin-bottom:0">${f(S.bal)}</div></div>
${M.map(m=>`<div class="card meth ${S.meth===m[0]?"on":""}" data-m="${m[0]}"><span class="mi">${m[1]}</span><div><b>${m[2]}</b><span class="mut">${m[3]}</span></div><span class="tag ok">ON</span></div>`).join("")}
<div class="card"><span class="mut">Amount in ₹</span><input id="amt" type="number" inputmode="numeric" min="10" value="${S.amt}" style="margin-top:6px"><div class="chips">${[50,100,500,1000].map(a=>`<span data-a="${a}">₹${a}</span>`).join("")}</div><button class="btn" id="pay">Add ₹<span id="pa">${S.amt}</span></button></div>
<div class="row"><h3>Recharge history</h3><a id="rf">Refresh</a></div><div class="card" id="hist"><div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div></div>`},
orders(){return `<h2 style="margin:6px 2px 14px">Orders</h2><div class="card">`+(S.orders.length?S.orders.map(o=>`<div class="item"><span class="fl" style="font-size:28px">${o.fl}</span><div><b>${o.n}</b><small>${o.id} · ${new Date(o.t).toLocaleString()}</small></div><div style="text-align:right;flex:none"><b>${f(o.p)}</b><small class="${o.s==="Completed"?"ok":""}">${o.s}</small></div></div>`).join(""):`<div class="mut" style="text-align:center;padding:18px 0">No orders yet. Pick a country in Buy to place your first order.</div><button class="btn" data-go="buy">Go to Buy</button>`)+`</div>`},
settings(){return `<h2 style="margin:6px 2px 14px">Settings</h2><div class="card">
<div class="set" data-s="bot"><span>🤖</span><div><b>Bot connect</b><small>Telegram ID ${S.user.id} · same wallet as the bot</small></div><span class="tag ok">Live</span></div>
<div class="set"><span>💱</span><div><b>Currency</b><small>Choose display currency</small></div><select id="cur"><option value="INR" ${S.cur==="INR"?"selected":""}>₹ INR</option><option value="USDT" ${S.cur==="USDT"?"selected":""}>$ USDT</option></select></div>
<div class="set" data-s="dark"><span>🌙</span><div><b>Dark mode</b><small>Easy on the eyes at night</small></div><span class="sw ${isDark()?"on":""}"></span></div>
<div class="set" data-s="ch"><span>📣</span><div><b>Telegram channel</b><small>Updates and offers</small></div></div>
<div class="set" data-s="sup"><span>🎧</span><div><b>Contact support</b><small>Message us on Telegram</small></div></div>
<div class="set" data-s="out"><span>🚪</span><div><b>Log out</b><small>Sign out from this device</small></div></div></div>`},
login(){return `<div class="lg"><div class="logo">P</div><h1>Prime Store</h1><div class="mut" style="text-align:center">Telegram account store</div><div class="card" style="margin-top:20px"><div class="tabs"><span class="on">Telegram</span><span>Email</span><span>Phone</span></div><button class="btn" id="tg">Continue with Telegram</button><div class="mut" id="lmsg" style="text-align:center;margin:12px 0">The bot will send you your ID and password.</div><div class="mut" style="text-align:center">or log in with your ID and password</div><input id="uid" inputmode="numeric" placeholder="Telegram user ID" style="margin:10px 0"><input id="upw" type="password" placeholder="Password" autocomplete="current-password" style="margin-bottom:10px"><button class="btn ghost" id="go">Log in</button></div></div>`}};
function stagger(){[...$("#app .view,#app").children].forEach((e,i)=>e.style.setProperty("--i",i))}
function countUp(){const e=$("#bal");if(!e)return;const t=S.bal,t0=performance.now();(function s(n){const p=Math.min((n-t0)/900,1),v=t*(1-Math.pow(1-p,3));e.textContent=f(v);if(p<1)requestAnimationFrame(s)})(t0)}
function render(){const a=$("#app"),n=$("#nav");theme();
if(!S.user){n.hidden=true;a.innerHTML=`<div class="view">${V.login()}</div>`;stagger();return}
n.hidden=false;n.innerHTML=`<i style="transform:translateX(${TABS.findIndex(t=>t[0]===S.tab)*100}%)"></i>`+TABS.map(t=>`<button data-go="${t[0]}" class="${S.tab===t[0]?"on":""}"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join("");
a.innerHTML=`<div class="view">${V[S.tab]()}</div>`;stagger();
if(S.tab==="home")countUp();if(S.tab==="recharge")loadHist()}
function loadHist(){clearTimeout(loadHist.t);loadHist.t=setTimeout(()=>{const h=$("#hist");if(!h)return;h.innerHTML=S.tops.length?S.tops.map(t=>`<div class="item"><span>💰</span><div><b>${f(t.a)}</b><small>${new Date(t.t).toLocaleString()}</small></div><span class="tag">${t.s}</span></div>`).join(""):`<div class="mut" style="text-align:center">No recharges yet. Add your first balance above.</div>`},900)}
function go(t){if(t===S.tab&&S.user)return;S.tab=t;render();scrollTo({top:0})}
function sheet(h){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sheet">${h}</div>`;o.onclick=e=>{if(e.target===o||e.target.dataset.x!==undefined)o.remove()};document.body.appendChild(o);return o}
function buy(k){toast("Opening the bot to complete your order");setTimeout(()=>open(botUrl(),"_blank"),600)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-buy],[data-m],[data-a],[data-s],[data-k],#tg,#go,#pay,#rf");if(!t)return;
if(t.dataset.go)return go(t.dataset.go);
if(t.dataset.k){S.kind=t.dataset.k;C=S.kind==="wa"?S.wa:S.tg;return render()}
if(t.dataset.buy)return buy(t.dataset.buy);
if(t.dataset.m){S.meth=t.dataset.m;document.querySelectorAll(".meth").forEach(x=>x.classList.toggle("on",x.dataset.m===S.meth));return}
if(t.dataset.a){$("#amt").value=t.dataset.a;S.amt=+t.dataset.a;$("#pa").textContent=S.amt;return}
if(t.id==="rf"){$("#hist").innerHTML='<div class="sk"></div><div class="sk" style="width:70%"></div>';return loadHist()}
if(t.id==="tg")return tgLogin();
if(t.id==="go")return pwLogin();
if(t.id==="pay"){toast("Opening the bot to add balance");setTimeout(()=>open(botUrl(),"_blank"),600);return}
const s=t.dataset.s;if(s==="dark"){S.dark=!isDark();ST.set("ps_dark",S.dark);theme();t.querySelector(".sw").classList.toggle("on",S.dark)}
else if(s==="out"){fetch("/api/auth",{method:"DELETE"}).finally(()=>{S.user=null;render()})}
else if(s==="bot")open(botUrl(),"_blank");
else if(s)toast("Link will be added soon")});
document.addEventListener("input",e=>{if(e.target.id==="q"){const q=e.target.value.toLowerCase();const r=C.filter(c=>c[0].toLowerCase().includes(q)||c[1].toLowerCase()===q);$("#cg").innerHTML=r.length?r.map(cardC).join(""):'<div class="mut" style="grid-column:1/-1;text-align:center">No country found. Try another name.</div>'}
if(e.target.id==="amt"){S.amt=+e.target.value||0;$("#pa").textContent=S.amt}});
document.addEventListener("change",e=>{if(e.target.id==="cur"){S.cur=e.target.value;ST.set("ps_cur",S.cur);toast("Currency changed to "+S.cur);render()}});
let poll;
const api=b=>fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong");return d});
const msg=t=>{const m=$("#lmsg");if(m)m.textContent=t};
async function tgLogin(){const bt=$("#tg");bt.disabled=true;msg("Opening the bot…");try{const d=await api({action:"start"});open(d.link,"_blank");const m=$("#lmsg");if(m){m.textContent="";const a=document.createElement("a");a.href=d.link;a.target="_blank";a.rel="noopener";a.textContent="Tap here if Telegram did not open";a.style.color="var(--pri)";m.append("Tap Start in the bot and you will be logged in here automatically. ",a)}
clearInterval(poll);const end=Date.now()+3e5;poll=setInterval(async()=>{if(Date.now()>end){clearInterval(poll);bt.disabled=false;return msg("Link expired. Please try again.")}try{const r=await api({action:"poll",tok:d.tok,sec:d.sec});if(r.ok){clearInterval(poll);await boot()}}catch(e){clearInterval(poll);bt.disabled=false;msg(e.message)}},2000)}catch(e){bt.disabled=false;msg(e.message)}}
async function pwLogin(){const id=($("#uid").value||"").replace(/\D/g,""),pw=$("#upw").value;if(!id||!pw)return msg("Enter your ID and password");try{await api({action:"password",id,password:pw});await boot()}catch(e){msg(e.message)}}
async function boot(){try{const r=await fetch("/api/data");const d=await r.json();S.bot=d.bot||S.bot;if(r.ok){S.user=d.user;S.bal=d.balance;S.tg=d.tg;S.wa=d.wa;C=S.kind==="wa"?S.wa:S.tg;S.orders=d.orders;S.tops=d.topups;S.plats=d.plats||[]}else if(r.status===401){S.user=null}else throw 0}catch(e){toast("Could not load data. Please refresh.")}S.ready=true;render()}
/* ---------- Social media services (home tile -> platform -> service -> order form) ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SM={step:"plat",plat:null,plabel:"",list:null,svc:null,cache:{},res:null};
const smBox=()=>document.getElementById("sm");
const smClose=()=>{const b=smBox();if(b)b.closest(".ov").remove()};
const smCost=(s,q)=>Math.max(1,Math.ceil(+(s.r*q/1000*100).toFixed(6))); // paise, same formula as the bot
const smQty=()=>parseInt((($("#sn")||{}).value||"").replace(/,/g,""),10);
const smRows=(L,q)=>{q=(q||"").toLowerCase().trim();const r=L.filter(s=>!q||s.n.toLowerCase().includes(q)||String(s.id)===q);
return r.length?r.slice(0,100).map(s=>`<div class="svr" data-ss="${s.id}"><b>${esc(s.n)}</b><small>${f(s.r)} per 1,000 · Min ${s.lo} · Max ${s.hi}</small></div>`).join("")+(r.length>100?`<div class="mut" style="text-align:center;padding:10px">Showing 100 of ${r.length}. Search to narrow it down.</div>`:""):'<div class="mut" style="text-align:center;padding:16px">No service found.</div>'};
const act=b=>fetch("/api/act",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong");return d});
async function reload(){try{const r=await fetch("/api/data");if(!r.ok)return;const d=await r.json();S.bal=d.balance;S.orders=d.orders;S.tops=d.topups;S.plats=d.plats||[];if(S.tab!=="recharge")render()}catch(e){}}
function smmOpen(){SM.step="plat";SM.svc=null;SM.res=null;const o=sheet('<div id="sm"></div>');o.firstChild.classList.add("tall");smmDraw()}
function smmDraw(){const b=smBox();if(!b)return;const X='<button class="ic" data-x aria-label="Close">✕</button>';
if(SM.step==="plat"){const P=S.plats||[];
b.innerHTML=`<div class="sx"><h3>Social media services</h3>${X}</div><div class="mut" style="margin-bottom:12px">Which service do you need? Pick a platform.</div>`+(P.length?`<div class="g2">${P.map(p=>{const i=p[1].indexOf(" ");return `<div class="card cn" data-sp="${esc(p[0])}"><div class="fl">${esc(i>0?p[1].slice(0,i):"🌐")}</div><div class="nm">${esc(i>0?p[1].slice(i+1):p[1])}</div><div class="mut">${p[2]} services</div></div>`}).join("")}</div>`:'<div class="mut" style="text-align:center;padding:20px 0">No services are available right now. Please check back soon.</div>')}
else if(SM.step==="svc"){
b.innerHTML=`<div class="sx"><button class="ic" data-sb="plat" aria-label="Back">←</button><h3>${esc(SM.plabel)}</h3>${X}</div><input id="sq" placeholder="Search service" autocomplete="off" style="margin-bottom:6px"><div id="svl">${SM.list?smRows(SM.list,""):'<div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div>'}</div>`}
else if(SM.step==="form"){const s=SM.svc;
b.innerHTML=`<div class="sx"><button class="ic" data-sb="svc" aria-label="Back">←</button><h3>Place order</h3>${X}</div><div class="card" style="margin-bottom:12px"><b>${esc(s.n)}</b><div class="mut">${f(s.r)} per 1,000 · Min ${s.lo} · Max ${s.hi} · Refill: ${s.rf?"Yes":"No"}</div></div><span class="mut">Link</span><input id="sl" placeholder="https://… or @username" autocomplete="off" autocapitalize="off" style="margin:6px 0 12px"><span class="mut">Quantity</span><input id="sn" type="number" inputmode="numeric" placeholder="${s.lo} to ${s.hi}" style="margin:6px 0 4px"><div class="tot"><span>Total</span><span id="stot">${f(0)}</span></div><div class="mut" style="margin:0 2px">Balance: ${f(S.bal)}</div><div class="err" id="serr"></div><button class="btn" id="sgo">Place order</button>`}
else if(SM.step==="done"){const r=SM.res;
b.innerHTML=`<div class="sx"><h3>Order placed</h3>${X}</div><div style="text-align:center;padding:6px 0 14px"><div style="font-size:54px">✅</div><div class="mut">${esc(r.name)}</div></div><div class="card"><div class="item"><div><small>Order ID</small><b style="word-break:break-all">${esc(r.oid)}</b></div></div><div class="item"><div><small>Quantity</small><b>${r.qty}</b></div><div style="text-align:right;flex:none"><small>Charged</small><b>${f(r.cost)}</b></div></div></div><button class="btn" data-sb="orders">View orders</button><button class="btn ghost sm" data-sb="plat">Order more</button>`}
else if(SM.step==="check"){const r=SM.res;
b.innerHTML=`<div class="sx"><h3>Order is being checked</h3>${X}</div><div style="text-align:center;padding:6px 0 14px"><div style="font-size:54px">⏳</div></div><div class="card mut">${esc(r.error||"We are confirming this order. Please do not order again. You will get the result in your Orders and on Telegram.")}${r.oid?"<br><br>Order ID: <b>"+esc(r.oid)+"</b>":""}</div><button class="btn" data-sb="orders">View orders</button>`}}
function smmCalc(){const s=SM.svc;if(!s||SM.step!=="form"||!smBox())return;const q=smQty(),ok=q>=s.lo&&q<=s.hi,c=ok?smCost(s,q)/100:0,g=$("#sgo"),e=$("#serr");
$("#stot").textContent=f(c);if(ok&&c>S.bal){e.textContent="You need "+f(c-S.bal)+" more.";g.textContent="Add funds";g.dataset.fund="1"}else{if(e.textContent.startsWith("You need"))e.textContent="";g.textContent="Place order";delete g.dataset.fund}}
function smmBusy(on){["#sgo","#sl","#sn"].forEach(k=>{const e=$(k);if(e)e.disabled=on});const g=$("#sgo");if(g)g.textContent=on?"Placing order…":"Place order"}
async function smmWait(id){const end=Date.now()+105e3;while(Date.now()<end){await new Promise(r=>setTimeout(r,1500));try{const r=await act({action:"job",id});if(["done","error","checking","expired"].includes(r.status))return r}catch(e){}}return{status:"checking",error:"We could not confirm it yet. Please check your Orders before trying again."}}
async function smmPlace(){const s=SM.svc,link=$("#sl").value.trim(),q=smQty(),e=$("#serr");
if(!link){e.textContent="Enter the link for this order.";return}
if(!(q>=s.lo&&q<=s.hi)){e.textContent="Enter a quantity between "+s.lo+" and "+s.hi+".";return}
e.textContent="";smmBusy(true);
try{const d=await act({action:"smm",service_id:s.id,link,qty:q,cost:smCost(s,q)});const r=await smmWait(d.id);
if(!smBox()){toast(r.status==="done"?"Order placed ✅":(r.error||"Your order is being checked"));return reload()}
if(r.status==="error"||r.status==="expired"){smmBusy(false);smmCalc();const x=$("#serr");if(x)x.textContent=r.error||"Could not place the order.";return reload()}
SM.res=r;SM.step=r.status==="done"?"done":"check";smmDraw();reload()}
catch(err){if(smBox()){smmBusy(false);const x=$("#serr");if(x)x.textContent=err.message}}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-smm],[data-sp],[data-ss],[data-sb],#sgo");if(!t)return;
if(t.dataset.smm!==undefined)return smmOpen();
if(t.id==="sgo"){if(t.dataset.fund){smmClose();return go("recharge")}return smmPlace()}
if(t.dataset.sb!==undefined){const v=t.dataset.sb;if(v==="orders"){smmClose();return go("orders")}SM.step=v;return smmDraw()}
if(t.dataset.sp!==undefined){const k=t.dataset.sp,p=(S.plats||[]).find(x=>x[0]===k);SM.plat=k;SM.plabel=p?p[1]:k;SM.step="svc";SM.list=SM.cache[k]||null;smmDraw();
if(!SM.list)fetch("/api/data?plat="+encodeURIComponent(k)).then(r=>r.ok?r.json():Promise.reject()).then(d=>{SM.cache[k]=d.services||[];if(SM.plat===k){SM.list=SM.cache[k];const l=$("#svl");if(l&&SM.step==="svc")l.innerHTML=smRows(SM.list,($("#sq")||{}).value)}}).catch(()=>{toast("Could not load services. Please try again.");SM.step="plat";smmDraw()});return}
if(t.dataset.ss!==undefined){const s=(SM.list||[]).find(x=>String(x.id)===t.dataset.ss);if(s){SM.svc=s;SM.step="form";smmDraw()}}});
document.addEventListener("input",e=>{if(e.target.id==="sq"&&SM.list){$("#svl").innerHTML=smRows(SM.list,e.target.value)}if(e.target.id==="sn")smmCalc()});

boot();
</script>
</body>
</html>

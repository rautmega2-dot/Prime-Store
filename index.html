<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Store</title>
<style>
:root{--bg1:#F4F8FF;--bg2:#DCE8FF;--ink:#0F1D3F;--mut:#5A6E95;--pri:#2F5BFF;--pri2:#5B8CFF;--btn1:#6B9BFF;--btn2:#2D47E8;--btnink:#fff;--acc:#1AB4E8;--card:rgba(255,255,255,.88);--navbg:rgba(255,255,255,.95);--line:rgba(45,71,232,.14);--ok:#14a077;--bad:#e0436a;--sh:0 10px 26px rgba(45,71,232,.14);--glow:rgba(45,71,232,.32);--blob:#A9C4FF;--blob2:#BFE9FF;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0B1530;--bg2:#050B1D;--ink:#EAF0FF;--mut:#9DB3E6;--pri:#8FB0FF;--pri2:#5B8CFF;--btn1:#5B8CFF;--btn2:#2D47E8;--card:rgba(234,240,255,.07);--navbg:rgba(16,28,60,.96);--line:rgba(234,240,255,.13);--ok:#5bd69b;--bad:#ff7d9d;--sh:0 10px 26px rgba(0,0,0,.45);--glow:rgba(91,140,255,.3);--blob:#1B3A9E;--blob2:#0E5E7E;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#0B1530;--bg2:#050B1D;--ink:#EAF0FF;--mut:#9DB3E6;--pri:#8FB0FF;--pri2:#5B8CFF;--btn1:#5B8CFF;--btn2:#2D47E8;--card:rgba(234,240,255,.07);--navbg:rgba(16,28,60,.96);--line:rgba(234,240,255,.13);--ok:#5bd69b;--bad:#ff7d9d;--sh:0 10px 26px rgba(0,0,0,.45);--glow:rgba(91,140,255,.3);--blob:#1B3A9E;--blob2:#0E5E7E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--blob) 0%,transparent 68%);opacity:.55;z-index:-1;animation:drift 22s ease-in-out infinite alternate;will-change:transform;pointer-events:none}
body::before{top:-150px;left:-140px}
body::after{bottom:-180px;right:-160px;background:radial-gradient(circle,var(--blob2) 0%,transparent 68%);opacity:.5;animation-delay:-10s;animation-duration:26s}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(60px,70px,0)}}
#app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3{margin:0;letter-spacing:-.01em}

/* scroll reveal (no blur, only transform + opacity) */
.rv{opacity:0;transform:translate3d(0,30px,0) scale(.94);transition:opacity .5s var(--ease) var(--d,0ms),transform .75s var(--spring) var(--d,0ms)}
.g2>.rv:nth-child(odd){transform:translate3d(-26px,24px,0) scale(.94) rotate(-2deg)}
.g2>.rv:nth-child(even){transform:translate3d(26px,24px,0) scale(.94) rotate(2deg)}
.item.rv,.sel.rv,.set.rv,.kv.rv{transform:translate3d(-24px,0,0)}
.rv.in,.g2>.rv.in:nth-child(n){opacity:1;transform:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);transition:transform .3s var(--ease)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:32%;display:grid;place-items:center;color:var(--btnink);background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:var(--sh);animation:float 4s ease-in-out infinite;transition:transform .5s var(--spring)}
.logo svg{width:60%;height:60%}
.logo:active{transform:rotate(-14deg) scale(.9)}
.spk{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-4deg)}}
.top b{font-size:17px}.top .sp{flex:1}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:16px;transition:transform .45s var(--spring)}
.ic:active{transform:scale(.85) rotate(90deg)}
.mut{color:var(--mut);font-size:13px}
.hi h1{font-size:30px;margin-top:2px}
.btn{position:relative;overflow:hidden;width:100%;border:0;border-radius:18px;padding:14px;font:700 15px inherit;font-family:inherit;color:var(--btnink);background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 8px 20px var(--glow);cursor:pointer;transition:transform .3s var(--spring);-webkit-user-select:none;user-select:none}
.btn:not(.sm):not(.ghost)::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-160%) skewX(-20deg);animation:shine 4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,50%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(330%) skewX(-20deg)}}
@media (hover:hover){.btn:hover{transform:translateY(-2px)}}
.btn:active{transform:scale(.94)}.btn:disabled{opacity:.45;box-shadow:none}.btn:disabled::after{display:none}
.btn.sm{padding:9px;font-size:13px;border-radius:14px;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rp .7s var(--ease) forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.big{font-size:38px;font-weight:800;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2 .card{margin:0}
.stat b{display:block;font-size:24px;margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.row a{color:var(--pri);font-size:13px;font-weight:700;cursor:pointer;display:inline-block;transition:transform .3s var(--spring)}
.row a:active{transform:translateX(4px) scale(.95)}
.cn{text-align:center;padding:14px 10px}
.cn:active{transform:scale(.95)}
.fl{font-size:34px;line-height:1.1}
.cn .nm{font-weight:700;margin-top:4px}
.pr{font-size:20px;font-weight:800;margin:6px 0 0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--ink)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tag.ok{animation:blink 2.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.5}}
input,select{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none;transition:border-color .3s,box-shadow .3s var(--ease),transform .35s var(--spring)}
input:focus,select:focus{border-color:var(--pri2);box-shadow:0 0 0 4px var(--glow);transform:translateY(-2px)}
input::placeholder{color:var(--mut);opacity:.8}
.meth{display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid transparent}
.meth:active{transform:scale(.96)}.meth.on{border-color:var(--pri2);box-shadow:0 8px 22px var(--glow)}
.meth .mi{font-size:26px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--line);transition:transform .5s var(--spring)}
.meth.on .mi{transform:scale(1.14) rotate(-8deg)}
.meth div{flex:1}.meth b{display:block}
.chips{display:flex;gap:8px;margin:10px 0}
.chips span{flex:1;text-align:center;padding:8px;border-radius:14px;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:13px;transition:transform .35s var(--spring),border-color .3s,background .3s}
.chips span:active{transform:scale(.88)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item div{flex:1}.item small{display:block;color:var(--mut)}
.sk{height:14px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,var(--line),rgba(255,255,255,.45),var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.set:active{transform:translateX(8px)}
.set:last-child{border:0}.set div{flex:1}.set small{display:block;color:var(--mut);font-size:12px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .3s var(--ease);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .45s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:var(--pri2)}.sw.on::after{transform:translateX(20px)}
select{width:auto;padding:8px 10px;border-radius:12px}
nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(456px,calc(100% - 24px));display:flex;padding:6px;border-radius:30px;background:var(--navbg);border:1px solid var(--line);box-shadow:var(--sh);z-index:5;animation:navin .8s var(--spring) both}
@keyframes navin{from{transform:translate(-50%,130%);opacity:0}}
nav i{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:24px;background:linear-gradient(135deg,var(--btn1),var(--btn2));transition:transform .6s var(--spring);box-shadow:0 6px 16px var(--glow)}
nav button{flex:1;position:relative;border:0;background:none;color:var(--mut);padding:8px 0 6px;font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .3s,transform .35s var(--spring)}
nav button:active{transform:scale(.85)}
nav button.on{color:var(--btnink)}
nav button.on svg{animation:hop .6s var(--spring)}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(1.22)}100%{transform:none}}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px) scale(.9);background:var(--ink);color:var(--bg1);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;transition:transform .55s var(--spring);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0) scale(1)}
.ov{position:fixed;inset:0;background:rgba(8,16,48,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.sheet{width:min(480px,100%);background:var(--bg1);color:var(--ink);border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .55s var(--ease) both}
@keyframes up{from{transform:translateY(100%)}}
.sheet p{display:flex;justify-content:space-between;margin:8px 0}
.lg{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center}
.lg .logo{width:88px;height:88px;margin:0 auto 14px;animation:pop 1s var(--spring) both,float 4s ease-in-out 1s infinite}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}}
.lg h1{text-align:center;font-size:28px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs span{flex:1;text-align:center;padding:9px 4px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--line);opacity:.55;transition:all .35s var(--ease)}
.tabs span.on{opacity:1;background:var(--card);border-color:var(--pri2)}
.hero{background:linear-gradient(135deg,#6B9BFF,#2D47E8 62%,#4A35E0);color:#fff;border:0;position:relative;overflow:hidden;box-shadow:0 14px 30px var(--glow)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:170px;height:170px;border-radius:50%;background:rgba(120,200,255,.35);animation:drift 14s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.2);animation:drift 12s ease-in-out infinite alternate}
.hero>*{position:relative;z-index:1}
.hero .mut{color:rgba(255,255,255,.88)}
.hero .btn{background:#fff;color:#2438D6;box-shadow:none}
.cn .fl{width:60px;height:60px;margin:0 auto 6px;display:grid;place-items:center;border-radius:50%;background:var(--line);font-size:32px;transition:transform .5s var(--spring)}
.cn:active .fl{transform:scale(1.2) rotate(-10deg)}
.cn{background:linear-gradient(180deg,var(--card),transparent 160%)}
.chips span.on{border-color:var(--pri2);background:var(--card)}
.tiles{margin-top:14px}
.sq{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;padding:16px}
.sq:active{transform:scale(.95)}
.sq .em{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 8px 20px var(--glow);animation:bob 3.6s ease-in-out infinite}
.sq.alt .em{background:linear-gradient(135deg,#7BE8FA,#1AB4E8);box-shadow:0 8px 20px rgba(26,180,232,.4);animation-delay:-1.8s}
.sq b{display:block;font-size:17px;line-height:1.2}
.sq .mut{display:block;margin-top:4px}
.sel{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.sel:active{transform:translateX(8px)}
.sel:last-child{border:0}.sel>div{flex:1;min-width:0}.sel small{display:block;color:var(--mut);font-size:12px}.sel b{display:block;overflow-wrap:anywhere}
.sel .ch{flex:none;color:var(--mut);font-size:26px;line-height:1}
.sel.dis{opacity:.4;pointer-events:none}.sel.on b{color:var(--pri)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.kv span{color:var(--mut);flex:none}.kv b{text-align:right;overflow-wrap:anywhere;min-width:0}
.cp{margin-left:8px;border:1px solid var(--line);background:var(--card);color:var(--pri);border-radius:10px;padding:2px 9px;font:700 12px inherit;font-family:inherit;cursor:pointer;transition:transform .3s var(--spring)}
.cp:active{transform:scale(.8)}
.ord{cursor:pointer}.ord:active{transform:scale(.97)}.ord .ch{flex:none;color:var(--mut);font-size:22px}
.tot{display:flex;justify-content:space-between;margin:12px 2px 4px;font-weight:700}
.err{color:var(--bad);font-size:13px;margin:8px 2px;min-height:18px}
.view>div[style*="font-size:52px"],.view>div[style*="font-size:56px"]{animation:pop2 .8s var(--spring) both}
@keyframes pop2{from{transform:scale(.3) rotate(-30deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* bot DP logo */
.logo{position:relative;width:46px;height:46px;border-radius:50%;background:none;box-shadow:0 4px 14px var(--glow);overflow:visible}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;-webkit-user-drag:none}
.logo::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--pri2);opacity:0;animation:ring 2.8s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.55);opacity:0}}
.lg .logo{width:104px;height:104px}

/* ===== simple soft 3D (pink) ===== */
:root{--hi:rgba(255,255,255,.95);--inb:rgba(45,71,232,.07);--inb2:rgba(45,71,232,.18);--shd:rgba(45,71,232,.24);--cardtop:#FFFFFF;--cardbot:#F0F5FF;--inbg:#E9F0FF;--sph:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hi:rgba(255,255,255,.12);--inb:rgba(0,0,0,.2);--inb2:rgba(0,0,0,.45);--shd:rgba(0,0,0,.5);--cardtop:rgba(234,240,255,.11);--cardbot:rgba(234,240,255,.05);--inbg:rgba(0,0,0,.28);--sph:rgba(255,255,255,.2)}}
:root[data-theme="dark"]{--hi:rgba(255,255,255,.12);--inb:rgba(0,0,0,.2);--inb2:rgba(0,0,0,.45);--shd:rgba(0,0,0,.5);--cardtop:rgba(234,240,255,.11);--cardbot:rgba(234,240,255,.05);--inbg:rgba(0,0,0,.28);--sph:rgba(255,255,255,.2)}
.logo{width:44px;height:44px}
.logo::after{content:none}
.lg .logo{width:88px;height:88px}
.card{border-radius:28px;background:linear-gradient(180deg,var(--cardtop),var(--cardbot));border:1px solid var(--line);box-shadow:0 14px 26px -10px var(--shd),inset 0 1.5px 0 var(--hi)}
.hero{border-radius:30px;background:radial-gradient(120% 80% at 18% 0%,rgba(255,255,255,.35),transparent 55%),linear-gradient(135deg,#6B9BFF,#2D47E8 62%,#4A35E0);box-shadow:0 18px 30px -10px var(--glow),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -10px 20px rgba(10,25,100,.12);text-shadow:0 1px 2px rgba(10,30,120,.25)}
.hero .btn{text-shadow:none}
.btn{border-radius:18px;box-shadow:0 10px 18px -6px var(--glow),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(10,30,120,.16)}
.btn.ghost{background:linear-gradient(180deg,var(--cardtop),var(--cardbot));box-shadow:0 5px 10px -4px var(--shd),inset 0 1.5px 0 var(--hi)}
.btn.sm{box-shadow:0 6px 12px -4px var(--glow),inset 0 1.5px 0 rgba(255,255,255,.35)}
.btn:disabled{box-shadow:none}
.hero .btn{box-shadow:0 6px 12px -4px rgba(10,25,100,.25)}
input,select{background:var(--inbg);box-shadow:inset 0 2px 5px var(--inb2)}
input:focus,select:focus{box-shadow:inset 0 2px 5px var(--inb2),0 0 0 4px var(--glow)}
.ic{background:linear-gradient(180deg,var(--cardtop),var(--cardbot));box-shadow:0 6px 12px -4px var(--shd),inset 0 1.5px 0 var(--hi)}
.sq .em{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.45),transparent 50%),linear-gradient(135deg,var(--btn1),var(--btn2))}
.sq.alt .em{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.5),transparent 50%),linear-gradient(135deg,#7BE8FA,#1AB4E8)}
.cn .fl,.meth .mi{background:radial-gradient(circle at 30% 25%,var(--sph),var(--cardbot) 80%);box-shadow:0 6px 10px -4px var(--shd),inset 0 -3px 6px var(--inb)}
.chips span{background:linear-gradient(180deg,var(--cardtop),var(--cardbot));box-shadow:0 3px 6px -2px var(--shd),inset 0 1.5px 0 var(--hi)}
nav{box-shadow:0 14px 28px -8px var(--shd),inset 0 1.5px 0 var(--hi)}
nav i{box-shadow:0 8px 16px -4px var(--glow),inset 0 2px 0 rgba(255,255,255,.4)}

/* ===== fast response ===== */
html,body,button,input,select,.card,.set,.sel,.item,.chips span,nav button{touch-action:manipulation}
.btn{transition:transform .22s var(--spring),box-shadow .22s}
.btn:active{transition-duration:.05s}
.rv{transition:opacity .3s var(--ease) var(--d,0ms),transform .45s var(--ease) var(--d,0ms)}
nav i{transition:transform .38s cubic-bezier(.3,1.25,.5,1)}

.pg{gap:12px}
.pt{display:flex;flex-direction:column;gap:12px;padding:16px;cursor:pointer;transition:transform .2s}
.pt:active{transform:scale(.95)}
.pt .pi{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6B9BFF,#2D47E8);box-shadow:0 8px 16px -6px var(--glow),inset 0 2px 0 rgba(255,255,255,.35)}
.pg>.pt:nth-child(4n+2) .pi{background:linear-gradient(135deg,#7BE8FA,#1AB4E8)}
.pg>.pt:nth-child(4n+3) .pi{background:linear-gradient(135deg,#B7A1FF,#6A47F2)}
.pg>.pt:nth-child(4n+4) .pi{background:linear-gradient(135deg,#FFD27A,#FF8A1E)}
.pt .pi svg,.chips span svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pt .pi svg{width:25px;height:25px}
.pt .nm{display:block;font-size:16px}
.pt .cnt{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pt .cl{color:var(--mut);font-size:12px}
.pt.on{border-color:var(--pri2)}
.chips span svg{width:15px;height:15px;vertical-align:-3px;margin-right:6px}
svg.brand{fill:none!important;stroke:none!important;display:inline-block;flex:none;width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.pt .pi.bl{background:none;box-shadow:none}
.pt .pi.bl svg.brand{width:50px;height:50px;margin:0;filter:drop-shadow(0 6px 8px var(--glow))}
.sel svg.brand{width:22px;height:22px;vertical-align:-5px;margin-right:9px}
.item .fl svg.brand{width:34px;height:34px;margin:0;vertical-align:middle}
.chips span svg.brand{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.kd svg.brand{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.btn svg.brand{width:22px;height:22px;vertical-align:-6px;margin-right:8px}
.set>span:first-child svg.brand{width:28px;height:28px;margin:0;vertical-align:middle}
h2 svg.brand{width:26px;height:26px;vertical-align:-6px;margin-right:8px}
nav[hidden]{display:none!important}

.stk{display:flex;align-items:center;gap:12px;margin:14px 2px;cursor:pointer;font-weight:600;-webkit-user-select:none;user-select:none}
.stk:active .sw::after{width:28px}
.ofl span{white-space:nowrap}
.ofl span i{font-style:normal;font-size:11px;opacity:.7;margin-left:2px}
.ofl span.on i{opacity:1}
.item .kd{margin-top:5px;font-size:10.5px;padding:2px 9px}
.kd.tg{background:rgba(45,71,232,.14);color:var(--pri)}
.kd.wa{background:rgba(20,160,119,.15);color:var(--ok)}
.kd.smm{background:rgba(154,123,255,.2);color:#6a47f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kd.smm{color:#c4b2ff}}
:root[data-theme="dark"] .kd.smm{color:#c4b2ff}

/* rounder */
.card{border-radius:36px;padding:18px}
.g2 .card{border-radius:34px}
.hero{border-radius:40px;padding:20px}
.btn,.btn.ghost{border-radius:999px;padding:15px}
.btn.sm{border-radius:999px;padding:10px}
input,select{border-radius:999px;padding:14px 20px}
select{padding:9px 14px}
.chips span,.tabs span{border-radius:999px}
.cp{border-radius:999px;padding:3px 12px}
.ic{border-radius:50%}
.sq .em{border-radius:50%}
.meth .mi{border-radius:50%}
.sq{border-radius:36px}
.pt{border-radius:34px}
.pt .pi{border-radius:50%}
.sheet{border-radius:36px 36px 0 0}
nav{border-radius:40px}
nav i{border-radius:34px}
.card.list,.card:has(>.item),.card:has(>.set),.card:has(>.kv),.card:has(>.sel){padding-left:20px;padding-right:20px}

const clip=t=>{try{navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>toast("Could not copy"))}catch(e){toast("Could not copy")}};
const cpb=t=>`<button class="cp" data-cp="${esc(t)}">Copy</button>`;
async function reload(){try{const r=await fetch("/api/data");if(!r.ok)return;const d=await r.json();S.bal=d.balance;S.orders=d.orders;S.tops=d.topups;S.plats=d.plats||[];S.cfg=d.cfg||{};if(S.cfg.fx>0)RATE=S.cfg.fx;if(!S.sub&&S.tab!=="recharge")render()}catch(e){}}
async function jobWait(id){const end=Date.now()+105e3;let n=0;while(Date.now()<end){await new Promise(r=>setTimeout(r,n++?1200:500));try{const r=await act({action:"job",id});if(["done","error","checking","expired"].includes(r.status)){needJoin(r);return r}}catch(e){}}return{status:"checking",error:"We could not confirm it yet. Please check your Orders before trying again."}}
const topBar=(t,back)=>`<div class="top"><button class="ic" data-pb="${back}" aria-label="Back">←</button><b>${t}</b></div>`;

function smmOpen(){Object.assign(SM,{plat:null,plabel:"",cat:null,svc:null,list:null,cache:{},pick:"plat",q:"",link:"",qty:"",res:null,busy:false,err:"",loading:false});S.sub="smm";render();scrollTo({top:0})}
function pickRows(){const k=SM.pick,q=(SM.q||"").toLowerCase().trim();
if(k==="plat"){const P=S.plats||[];return P.length?P.map(p=>`<div class="sel ${SM.plat===p[0]?"on":""}" data-sp="${esc(p[0])}"><div><b>${brand(pb(p))}${esc(p[1])}</b><small>${p[2]} services</small></div><span class="ch">›</span></div>`).join(""):none("No services are available right now. Please check back soon.")}
const L=inCat().filter(s=>!q||s.n.toLowerCase().includes(q)||String(s.id)===q);
return L.length?L.slice(0,100).map(s=>`<div class="sel ${SM.svc&&SM.svc.id===s.id?"on":""}" data-ss="${s.id}"><div><b>${esc(s.n)}</b><small>${f(s.r)} per 1,000 · Min ${s.lo} · Max ${s.hi}</small></div><span class="ch">›</span></div>`).join("")+(L.length>100?none("Showing 100 of "+L.length+". Search to narrow it down."):""):none("No service found.")}
const PIC={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',camera:'<path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/>',users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3.2 3.2 0 0 1 0 6M18 14a6 6 0 0 1 3 6"/>',at:'<circle cx="12" cy="12" r="3.5"/><path d="M15.5 12v1.5a2.5 2.5 0 0 0 5 0V12a8.5 8.5 0 1 0-3.3 6.7"/>',music:'<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'};
const pi=k=>'<svg viewBox="0 0 24 24">'+(PIC[k]||PIC.globe)+'</svg>';
const pk=p=>{const t=(String(p[0])+" "+String(p[1])).toLowerCase();return/tele|chat|messag|discord|signal|viber/.test(t)?"chat":/whats|phone|sms|voice|call/.test(t)?"phone":/insta|photo|pinterest|snap/.test(t)?"camera":/you|video|tube|tiktok|reel|twitch|vimeo/.test(t)?"play":/face|fb|social|follow|like|member|group/.test(t)?"users":/twit|tweet|threads|\bx\b/.test(t)?"at":/spot|music|sound|audio/.test(t)?"music":"globe"};
function platGrid(){const P=S.plats||[];return P.length?`<div class="g2 pg">${P.map(p=>`<div class="card pt ${SM.plat===p[0]?"on":""}" data-sp="${esc(p[0])}"><span class="pi${pb(p)?" bl":""}">${brand(pb(p))||pi(pk(p))}</span><b class="nm">${esc(p[1])}</b><div><span class="cnt">${p[2]}</span><span class="cl"> services</span></div></div>`).join("")}</div>`:none("No services are available right now. Please check back soon.")}
function pickView(){if(SM.pick==="plat")return topBar("Select service",SM.svc?"pick":"exit")+platGrid();
return topBar(SM.plabel||"Choose service","toplat")+`<input id="psq" placeholder="Search" autocomplete="off" value="${esc(SM.q)}" style="margin-bottom:12px"><div class="card" style="padding:4px 16px" id="pl">${pickRows()}</div>`}
function formView(){const s=SM.svc,q=smQ();
return topBar("Social media services","exit")+`<div class="card" style="padding:4px 16px">
<div class="sel" data-pick="plat"><div><small>Platform</small><b>${SM.plat?brand(bkey(SM.plat+" "+SM.plabel))+esc(SM.plabel):"Select platform"}</b></div><span class="ch">›</span></div>
<div class="sel ${SM.plat&&SM.list?"":"dis"}" data-pick="svc"><div><small>Service</small><b>${s?esc(s.n):"Select service"}</b></div><span class="ch">›</span></div></div>`
+(SM.loading?SKEL:s?`<div class="card" style="padding:4px 16px"><div class="kv"><span>Rate</span><b>${f(s.r)} per 1,000</b></div><div class="kv"><span>Min / Max</span><b>${s.lo} / ${s.hi}</b></div><div class="kv"><span>Refill</span><b>${s.rf?"Yes":"No"}</b></div></div>
<div class="card"><span class="mut">Link</span><input id="sl" placeholder="https://… or @username" autocomplete="off" autocapitalize="off" value="${esc(SM.link)}" ${SM.busy?"disabled":""} style="margin:6px 0 12px"><span class="mut">Quantity</span><input id="sn" type="number" inputmode="numeric" placeholder="${s.lo} to ${s.hi}" value="${esc(SM.qty)}" ${SM.busy?"disabled":""} style="margin:6px 0 4px"><div class="tot"><span>Total</span><span id="stot">${f(q>=s.lo&&q<=s.hi?smCost(s,q)/100:0)}</span></div><div class="mut" style="margin:0 2px">Balance: ${f(S.bal)}</div><div class="err" id="serr">${esc(SM.err)}</div><button class="btn" id="sgo" ${SM.busy?"disabled":""}>${SM.busy?"Placing order…":"Place order"}</button></div>`
:none("Pick a platform, category and service to continue."))}
function resView(){const r=SM.res,ok=r.status==="done";
return topBar(ok?"Order placed":"Order is being checked","exit")+`<div style="text-align:center;font-size:56px;padding:6px 0 14px">${ok?"✅":"⏳"}</div><div class="card" style="padding:4px 16px"><div class="kv"><span>Service</span><b>${esc(r.name)}</b></div><div class="kv"><span>Quantity</span><b>${r.qty}</b></div><div class="kv"><span>Charged</span><b>${f(r.cost)}</b></div><div class="kv"><span>Order ID</span><b>${esc(r.oid)}${cpb(r.oid)}</b></div></div>`
+(ok?"":`<div class="card mut">${esc(r.error||"We are confirming this order. Please do not order again. You will get the result in your Orders and on Telegram.")}</div>`)
+(r.rid?`<button class="btn" data-ord="smm:${r.rid}">View order details</button>`:`<button class="btn" data-pb="orders">View orders</button>`)+`<button class="btn ghost sm" data-pb="again">Order more</button>`}
V.smm=()=>SM.res?resView():SM.pick?pickView():formView();

async function pickPlat(k){const p=(S.plats||[]).find(x=>x[0]===k);Object.assign(SM,{plat:k,plabel:p?p[1]:k,cat:null,svc:null,pick:null,q:"",err:"",list:SM.cache[k]||null});
if(!SM.list){SM.loading=true;render();try{const r=await fetch("/api/data?plat="+encodeURIComponent(k));if(!r.ok)throw 0;const d=await r.json();SM.cache[k]=d.services||[];if(SM.plat!==k)return;SM.list=SM.cache[k]}catch(e){Object.assign(SM,{plat:null,plabel:"",loading:false,pick:"plat"});toast("Could not load services. Please try again.");return render()}SM.loading=false}
SM.pick="svc";render();scrollTo({top:0})}
function smmCalc(){const s=SM.svc;if(S.sub!=="smm"||SM.pick||SM.res||!s||!$("#stot"))return;const q=smQ(),ok=q>=s.lo&&q<=s.hi,c=ok?smCost(s,q)/100:0,g=$("#sgo"),e=$("#serr");
$("#stot").textContent=f(c);if(ok&&c>S.bal){e.textContent="You need "+f(c-S.bal)+" more.";g.textContent="Add funds";g.dataset.fund="1"}else{if(e.textContent.startsWith("You need"))e.textContent="";g.textContent=SM.busy?"Placing order…":"Place order";delete g.dataset.fund}}
async function smmPlace(){const s=SM.svc,link=SM.link.trim(),q=smQ(),e=$("#serr");
if(!link){e.textContent="Enter the link for this order.";return}
if(!(q>=s.lo&&q<=s.hi)){e.textContent="Enter a quantity between "+s.lo+" and "+s.hi+".";return}
SM.busy=true;SM.err="";render();
try{const d=await act({action:"smm",service_id:s.id,link,qty:q,cost:smCost(s,q)});const r=await jobWait(d.id);SM.busy=false;
if(S.sub!=="smm"){toast(r.status==="done"?"Order placed ✅":(r.error||"Your order is being checked"));return reload()}
if(r.status==="error"||r.status==="expired"){SM.err=r.error||"Could not place the order.";render();return reload()}
SM.res=r;render();scrollTo({top:0});reload()}
catch(err){SM.busy=false;SM.err=err.message;if(S.sub==="smm")render()}}

/* order details page (like the status page in the bot) */
const ICON={Received:"✅",Bought:"📱",Failed:"❌"};
const sIcon=(k,st)=>{const l=String(st||"").toLowerCase();if(k==="smm")return l==="completed"?"✅":["canceled","cancelled","refunded","fail","failed","rejected"].includes(l)?"❌":l==="partial"?"⚠️":"⏳";return ICON[st]||"⏳"};
const kv=(a,b,c)=>b===""||b==null?"":`<div class="kv"><span>${a}</span><b>${b}${c||""}</b></div>`;
V.order=()=>{const d=S.od,t=topBar("Order details","orders");if(!d)return t+SKEL;if(d.err)return t+`<div class="card bad" style="text-align:center">${esc(d.err)}</div>`;
const when=new Date(d.created).toLocaleString(),b=S.odb?"disabled":"";
const head=`<div style="text-align:center;font-size:52px;padding:4px 0 2px">${sIcon(d.k,d.status)}</div><h2 style="text-align:center;margin-bottom:14px">${d.k==="smm"?"":brand(d.k==="wa"?"wa":"tg")}${d.k==="smm"?"Order status":d.k==="wa"?"WhatsApp order":"Number order"}</h2>`;
if(d.k==="smm")return t+head+`<div class="card" style="padding:4px 16px">${kv("Service",esc(d.name))}${kv("Platform",esc(d.plat))}${kv("Status",esc(d.status),"")}${kv("Quantity",d.qty)}${kv("Charged",f(d.cost))}${kv("Start",esc(d.start||"—"))}${kv("Remains",d.remains)}${kv("Refunded",d.refunded?"Yes · "+f(d.refunded):"No")}</div>
<div class="card" style="padding:4px 16px">${kv("Order ID",esc(d.oid),cpb(d.oid))}${kv("Placed",esc(when))}${kv("Link",esc((d.link||"").slice(0,70)),d.link?cpb(d.link):"")}</div>
<div class="card mut">ℹ️ ${esc(d.note)}</div>${d.canRefill?`<button class="btn" id="odl" ${b}>🔁 Request refill</button>`:""}<button class="btn ${d.canRefill?"ghost sm":""}" id="odr" ${b}>🔄 Refresh</button>`;
return t+head+`<div class="card" style="padding:4px 16px">${kv("Order ID",esc(d.oid),cpb(d.oid))}${kv("Country",esc(d.name))}${kv("Number",esc(d.number),d.number?cpb(d.number):"")}${kv("Line",esc(d.op))}${kv("Paid",f(d.cost))}${kv("Status",esc(d.status))}${kv("Placed",esc(when))}${kv("Code",esc(d.code),d.code?cpb(d.code):"")}${kv("Password",esc(d.pass),d.pass?cpb(d.pass):"")}${d.refunded?kv("Refunded",f(d.refunded)):""}</div>${d.note?`<div class="card mut">ℹ️ ${esc(d.note)}</div>`:""}${d.canCode?`<button class="btn" id="odc" ${b}>📩 Get code</button>`:""}${d.canCancel?`<button class="btn ghost sm" id="odx" ${b}>❌ Cancel &amp; refund</button>`:""}<button class="btn ${d.canCode?"ghost sm":""}" id="odr" ${b}>🔄 Refresh</button>`};
async function getOrder(k,i){const r=await fetch("/api/data?order="+k+":"+i);const d=await r.json().catch(()=>({}));return r.ok?d:{err:d.error||"Order not found"}}
async function openOrder(k,i){S.sub="order";S.od=null;S.odb=false;render();scrollTo({top:0});try{S.od=await getOrder(k,i)}catch(e){S.od={err:"Could not load. Please try again."}}if(S.sub==="order")render();watchOrder()}
let odT=0;function watchOrder(){clearInterval(odT);const d=S.od;if(!d||d.err||d.k!=="wa"||!d.canCode)return;odT=setInterval(async()=>{if(S.sub!=="order"||!S.od||S.odb||S.od.rid!==d.rid)return clearInterval(odT);try{const n=await getOrder("wa",d.rid);if(!n.err&&S.sub==="order"&&!S.odb){S.od=n;if(!n.canCode)clearInterval(odT);render()}}catch(e){}},8000)}
async function odAction(kind){const d=S.od;if(!d||S.odb)return;S.odb=true;render();
try{if(kind==="cancel"){if(!confirm("Cancel this number? If no code has arrived, your money goes back to your wallet."))throw new Error("");const j=await act({action:"wa_cancel",rid:d.rid});const r=await jobWait(j.id);toast(r.status==="done"?(r.note||"Done"):(r.error||"Please try again"))}else if(kind==="code"){const j=await act({action:d.k==="wa"?"wa_code":"tg_code",rid:d.rid});const r=await jobWait(j.id);toast(r.status==="done"?"✅ Code received":(r.error||"Please try again"))}else if(d.k==="smm"&&(kind==="refill"||d.canRefresh)){const j=await act({action:kind==="refill"?"refill":"refresh",rid:d.rid});const r=await jobWait(j.id);toast(r.status==="done"?(r.note||"Updated"):(r.error||"Please try again"))}else toast("Updated");
S.od=await getOrder(d.k,d.rid)}catch(e){if(e.message)toast(e.message)}S.odb=false;if(S.sub==="order")render();reload()}

document.addEventListener("click",e=>{const t=e.target.closest("[data-smm],[data-pick],[data-sp],[data-sc],[data-ss],[data-pb],[data-ord],[data-cp],#sgo,#odr,#odl");if(!t)return;
if(t.dataset.cp!==undefined)return clip(t.dataset.cp);
if(t.dataset.smm!==undefined)return smmOpen();
if(t.dataset.ord!==undefined){const[k,i]=t.dataset.ord.split(":");return openOrder(k,i)}
if(t.id==="odr")return odAction("refresh");if(t.id==="odl")return odAction("refill");
if(t.id==="sgo"){if(t.dataset.fund){S.sub=null;return go("recharge")}return smmPlace()}
if(t.dataset.pick!==undefined){SM.pick=t.dataset.pick;SM.q="";render();return scrollTo({top:0})}
if(t.dataset.pb!==undefined){const v=t.dataset.pb;if(v==="pick"){SM.pick=null;return render()}if(v==="toplat"){SM.pick="plat";SM.q="";render();return scrollTo({top:0})}if(v==="again")return smmOpen();
if(v==="paydone"){clearInterval(PY.t);S.sub=null;S.tab="recharge";render();return scrollTo({top:0})}
if(v==="payback"){if(PY.step==="pay"&&PY.m!=="bpay"&&!PY.res){clearInterval(PY.t);PY.step="amt";PY.err="";PY.inv=null;return render()}clearInterval(PY.t);S.sub=null;S.tab="recharge";render();return scrollTo({top:0})}if(v==="orders"){S.sub=null;S.tab="orders";render();return scrollTo({top:0})}S.sub=null;render();return scrollTo({top:0})}
if(t.dataset.sp!==undefined)return pickPlat(t.dataset.sp);
if(t.dataset.ss!==undefined){const s=(SM.list||[]).find(x=>String(x.id)===t.dataset.ss);if(s){SM.svc=s;SM.pick=null;render();scrollTo({top:0})}}});
document.addEventListener("input",e=>{const i=e.target.id;if(i==="psq"){SM.q=e.target.value;$("#pl").innerHTML=pickRows()}else if(i==="sl")SM.link=e.target.value;else if(i==="sn"){SM.qty=e.target.value;smmCalc()}});

const KN={tg:{app:"Telegram",act:"tg_buy",code:"tg_code",ord:"num",btn:"✅ Accept & buy",go:"Getting your number…",
how:"1️⃣ Buy the number<br>2️⃣ Log in to Telegram with it<br>3️⃣ Tap <b>Get code</b> here",
terms:"• ✅ No number available? Automatic full refund<br>• 🚫 No refund once the number is delivered<br>• 🔐 Use a fresh device or VPN of the same country",
steps:"1️⃣ Open Telegram and log in with this number<br>2️⃣ When Telegram sends the code, tap <b>Get code</b> below"},
wa:{app:"WhatsApp",act:"wa_buy",code:"wa_code",ord:"wa",btn:"✅ Accept & reserve",go:"Reserving your number…",
how:"1️⃣ Reserve the number<br>2️⃣ Ask WhatsApp to send the SMS code<br>3️⃣ Tap <b>Get code</b> here (it also shows up in your order by itself)",

function openBuy(code){const k=S.kind==="wa"?"wa":"tg",c=(k==="wa"?S.wa:S.tg||[]).find(x=>x[1]===code);if(!c)return;const g=(S.cfg||{})[k]||{};if(g.maint)return toast("This server is under maintenance. Please try again later.");Object.assign(TB,{c,k,busy:false,err:"",res:null});S.sub="buytg";render();scrollTo({top:0})}
V.buytg=()=>{const K=KN[TB.k],r=TB.res;if(r){const ok=r.status==="done",o=r.out||{};
return topBar(ok?"Number ready":"Order is being checked","exit")+`<div style="text-align:center;font-size:56px;padding:6px 0 14px">${ok?"✅":"⏳"}</div>`+(ok?`<div class="card" style="padding:4px 16px">${kv("Country",esc(o.name))}${kv("Number",esc(o.number),cpb(o.number))}${kv("Paid",f(o.cost/100))}</div><div class="card mut">${K.steps}</div><div class="err" id="tgerr">${esc(TB.err)}</div><button class="btn" id="tgc" ${TB.busy?"disabled":""}>${TB.busy?"Checking…":"📩 Get code"}</button><button class="btn ghost sm" data-ord="${K.ord}:${o.rid}">View order details</button>`:`<div class="card mut">${esc(r.error||"We are confirming this order. Please do not buy again. You will get a message soon.")}</div><button class="btn" data-pb="orders">View orders</button>`)}
const c=TB.c,cost=c[3],need=cost-S.bal,low=need>0;
return topBar("Order confirmation","exit")+`<div class="card" style="padding:4px 16px">${kv("App",brand(TB.k)+K.app)}${kv("Region",flag(c[5]||c[1])+" "+esc(c[0]))}${kv("Price",f(cost))}${kv("Stock",c[4]+" pcs")}${kv("Balance",f(S.bal))}</div>
<div class="card"><b>📌 How it works</b><div class="mut" style="margin-top:6px">${K.how}</div></div>
<div class="card"><b>🚨 Terms</b><div class="mut" style="margin-top:6px">${K.terms}</div></div>
<div class="err" id="tgerr">${low?"You need "+f(need)+" more.":esc(TB.err)}</div><button class="btn" id="tgb" ${TB.busy?"disabled":""}>${low?"Add funds":TB.busy?K.go:K.btn}</button>`};
async function tgBuy(){const c=TB.c,K=KN[TB.k];TB.busy=true;TB.err="";render();
try{const j=await act({action:K.act,code:c[1],cost:Math.round(c[3]*100)});const r=await jobWait(j.id);TB.busy=false;
if(S.sub!=="buytg"&&S.sub!=="join"){toast(r.status==="done"?"Number ready ✅":(r.error||"Your order is being checked"));return reload()}
if(r.status==="error"||r.status==="expired"){TB.err=r.error||"Could not buy the number.";render();return reload()}
TB.res=r;render();scrollTo({top:0});reload()}
catch(e){TB.busy=false;TB.err=e.message;if(S.sub==="buytg")render()}}
async function tgGetCode(){const o=(TB.res||{}).out||{},K=KN[TB.k];TB.busy=true;TB.err="";render();
try{const j=await act({action:K.code,rid:o.rid});const r=await jobWait(j.id);TB.busy=false;
if(r.status==="done"){toast("✅ Code received");return openOrder(K.ord,o.rid)}
TB.err=r.error||"Code hasn't arrived yet. Try again in a moment.";if(S.sub==="buytg")render()}
catch(e){TB.busy=false;TB.err=e.message;if(S.sub==="buytg")render()}}

const PM=[["upi","🏦","UPI","Instant top-up, auto verified","upi"],["bpay","🅱️","Binance Pay","Send to Pay ID and verify","bpay"],["cry","🪙","Crypto","Pay with any coin","crypto"]];
const CF=()=>S.cfg||{};
const PY={m:null,step:"amt",amt:0,ref:"",busy:false,err:"",res:null,inv:null,st:"",t:0};
const pcfg=()=>CF()[PM.find(x=>x[0]===PY.m)[4]]||{};
function openPay(m){if(!(S.user&&S.user.tos)){PY.next=m;S.sub="terms";render();return scrollTo({top:0})}const c=CF()[PM.find(x=>x[0]===m)[4]]||{};clearInterval(PY.t);Object.assign(PY,{m,step:m==="bpay"?"pay":"amt",amt:(c.presets||[c.min||10])[0],ref:"",busy:false,err:"",res:null,inv:null,st:""});S.sub="pay";render();scrollTo({top:0})}
const upiLink=()=>{const c=pcfg();return `upi://pay?pa=${encodeURIComponent(c.id)}&pn=${encodeURIComponent(c.name||"Store")}&am=${PY.amt}&cu=INR&tn=${encodeURIComponent("W"+((S.user&&S.user.id)||""))}`};
const invText=()=>PY.st==="expired"||PY.st==="failed"?"⌛ This invoice has expired. Nothing was paid, so nothing was charged.":PY.st==="review"?"Your payment is being checked by the owner.":"Waiting for your payment. Your wallet is credited automatically after the network confirms. This page updates by itself.";
const refBox=(ph,btn)=>`<div class="card"><input id="pyr" placeholder="${ph}" autocomplete="off" autocapitalize="off" value="${esc(PY.ref)}" ${PY.busy?"disabled":""} style="margin-bottom:8px"><div class="err" id="pyerr">${esc(PY.err)}</div><button class="btn" id="pygo" ${PY.busy?"disabled":""}>${PY.busy?"Verifying…":btn}</button></div>`;
V.pay=()=>{const m=PY.m,c=pcfg();
if(PY.res)return topBar("Payment successful","paydone")+`<div style="text-align:center;font-size:56px;padding:6px 0 14px">✅</div><div class="card" style="padding:4px 16px">${kv("Added",f(PY.res.amount))}${kv("Balance",f(S.bal))}</div><button class="btn" data-smm="1">🚀 Order now</button><button class="btn ghost sm" data-pb="paydone">Done</button>`;
const T={upi:"UPI · Instant top-up",bpay:"Binance Pay",cry:"Crypto · Auto"}[m],top=topBar(T,"payback");
if(m==="bpay")return top+`<div class="card" style="padding:4px 16px">${kv("Pay ID",esc(c.id),cpb(c.id))}${kv("Coin",esc((c.coins||[]).join("/")))}${kv("Minimum","₹"+c.min)}</div>${c.qr?'<div class="card" id="bqrw" style="text-align:center;display:none"></div>':""}<div class="card mut">1️⃣ Send ${esc((c.coins||[]).join("/"))} to this Pay ID in Binance<br>2️⃣ Enter your Order ID below and tap Verify</div>`+refBox("Binance Pay Order ID","✅ Verify payment");
if(PY.step==="amt")return top+`<div class="card" style="padding:4px 16px">${kv("Minimum","₹"+c.min)}${kv("Balance",f(S.bal))}</div><div class="card"><span class="mut">Amount in ₹</span><input id="pya" type="number" inputmode="numeric" value="${PY.amt}" ${PY.busy?"disabled":""} style="margin:6px 0"><div class="chips">${(c.presets||[]).map(a=>`<span data-pa="${a}">₹${a}</span>`).join("")}</div><div class="err" id="pyerr">${esc(PY.err)}</div><button class="btn" id="pygo" ${PY.busy?"disabled":""}>${m==="upi"?"Continue":PY.busy?"Creating invoice…":"Create invoice"}</button></div>`;
if(m==="upi")return top+`<div class="card" style="text-align:center"><div class="mut">Pay exactly</div><div class="big" style="font-size:34px;margin:4px 0 12px">₹${PY.amt}</div><div id="qr" style="display:inline-block;background:#fff;padding:10px;border-radius:14px"></div></div><div class="card" style="padding:4px 16px">${kv("UPI ID",esc(c.id),cpb(c.id))}${kv("Name",esc(c.name))}${kv("Amount","₹"+PY.amt)}</div><a class="btn" href="${esc(upiLink())}" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px">Open UPI app</a><div class="card mut" style="margin-bottom:0">After paying, enter your 12-digit UTR (or the FamPay transaction ID):</div>`+refBox("UTR or FMPIB… ID","✅ Verify payment");
const v=PY.inv||{};return top+`<div class="card" style="padding:4px 16px">${kv("Pay",v.usd+" USDT")}${kv("You get",f(v.inr))}${kv("Invoice ID",esc(v.track),cpb(v.track))}</div><a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px">💳 Pay now</a><div class="card mut" id="cst">${invText()}</div><div class="err" id="pyerr">${esc(PY.err)}</div><button class="btn ghost sm" id="cyk" ${PY.busy?"disabled":""}>🔄 Check payment</button>`};
async function loadBqr(){const w=$("#bqrw");if(!w)return;try{if(PY.qrImg===undefined){const r=await fetch("/api/data?bqr=1");PY.qrImg=r.ok?(await r.json()).img||"":""}if(PY.qrImg&&$("#bqrw")){const x=$("#bqrw");x.style.display="block";x.innerHTML=`<div style="display:inline-block;background:#fff;padding:10px;border-radius:14px"><img src="${PY.qrImg}" alt="Binance Pay QR" style="width:200px;max-width:100%;display:block"></div>`}}catch(e){}}
function payInit(){if(PY.m==="bpay"&&pcfg().qr&&!PY.res)loadBqr();const q=$("#qr");if(!q||q.firstChild)return;if(window.QRCode)new QRCode(q,{text:upiLink(),width:190,height:190});else q.remove()}
function payDone(amount){clearInterval(PY.t);PY.res={amount};PY.busy=false;render();scrollTo({top:0});reload().then(()=>{if(S.sub==="pay"&&PY.res)render()})}
function invState(st,inr){if(st==="paid")return payDone(inr);if(st!==PY.st){PY.st=st;const e=$("#cst");if(e)e.textContent=invText()}}
function startInv(){clearInterval(PY.t);PY.t=setInterval(async()=>{if(S.sub!=="pay"||PY.m!=="cry"||!PY.inv||PY.res)return clearInterval(PY.t);try{const r=await fetch("/api/data?inv="+encodeURIComponent(PY.inv.track));if(r.ok){const d=await r.json();invState(d.status,d.inr)}}catch(e){}},6000)}
async function payGo(){const m=PY.m,c=pcfg();PY.err="";
if(m!=="bpay"&&PY.step==="amt"){const a=Math.floor(PY.amt);if(!(a>=c.min&&a<=c.max)){PY.err="Enter an amount between ₹"+c.min+" and ₹"+c.max+".";return render()}PY.amt=a;
if(m==="upi"){PY.step="pay";return render()}
PY.busy=true;render();try{const j=await act({action:"crypto_invoice",inr:a});const r=await jobWait(j.id);PY.busy=false;if(r.status==="done"){PY.inv=r.out;PY.step="pay";PY.st="pending";render();return startInv()}PY.err=r.error||"Could not create the invoice.";render()}catch(e){PY.busy=false;PY.err=e.message;render()}return}
const ref=PY.ref.trim();if(!ref){PY.err="Enter your "+(m==="bpay"?"Order ID.":"UTR.");return render()}
PY.busy=true;render();
try{const j=await act(m==="upi"?{action:"upi_verify",amount:PY.amt,ref}:{action:"bpay_verify",ref});const r=await jobWait(j.id);PY.busy=false;
if(r.status==="done")return payDone((r.out||{}).amount);PY.err=r.error||"Could not verify the payment.";render()}
catch(e){PY.busy=false;PY.err=e.message;render()}}
async function cryCheck(){PY.busy=true;PY.err="";render();try{const j=await act({action:"crypto_check",track:PY.inv.track});const r=await jobWait(j.id);PY.busy=false;const o=r.out||{};
if(r.status==="done"){if(o.st==="paid")return payDone(o.inr);if(o.st==="pending")PY.err="Payment not received yet. If you just paid, wait for the network to confirm.";else PY.st=o.st}else PY.err=r.error||"Couldn't check right now.";render()}catch(e){PY.busy=false;PY.err=e.message;render()}}

document.addEventListener("click",e=>{const t=e.target.closest("[data-pm],[data-pa],#pygo,#cyk,#tgb,#tgc,#odc,#odx,#tosok,#joinok,[data-help]");if(!t)return;
if(t.dataset.help){HP=t.dataset.help;S.sub="help";render();return scrollTo({top:0})}
if(t.id==="odx")return odAction("cancel");
if(t.id==="tosok")return tosAccept();
if(t.id==="joinok")return joinCheck(true);
if(t.dataset.pm!==undefined)return openPay(t.dataset.pm);
if(t.dataset.pa!==undefined){PY.amt=+t.dataset.pa;const i=$("#pya");if(i)i.value=PY.amt;return}
if(t.id==="pygo")return payGo();if(t.id==="cyk")return cryCheck();
if(t.id==="tgb"){if(TB.c[3]>S.bal){S.sub=null;return go("recharge")}return tgBuy()}
if(t.id==="tgc")return tgGetCode();if(t.id==="odc")return odAction("code")});
document.addEventListener("input",e=>{const i=e.target.id;if(i==="pya")PY.amt=+e.target.value;else if(i==="pyr")PY.ref=e.target.value});

/* ---------- deposit terms, join channels, help pages ---------- */
let HP="help";
V.terms=()=>topBar("Deposit terms","paydone")+`<div class="card"><b>⚠️ Wallet Deposit Terms &amp; Conditions</b><div class="mut" style="margin-top:8px">• 🔒 <b>Non-Refundable:</b> All wallet recharges are 100% final and non-refundable.<br><br>• 🏦 <b>No Bank/Crypto Withdrawal:</b> Added wallet balance is strictly for purchasing services and cannot be withdrawn back.<br><br>• 🌐 <b>Network Accuracy:</b> Always send crypto on the exact selected network. Cross-chain mistakes cannot be recovered.<br><br>• 📦 <b>Stock Policy:</b> If a specific country/service is temporarily out of stock, your balance stays safe in your wallet for any other service or restock.</div></div><div class="mut" style="margin:0 2px 12px">By tapping I Accept &amp; Continue you agree to these terms. Contact support anytime if you need help with a transaction.</div><button class="btn" id="tosok">✅ I Accept &amp; Continue</button>`;
async function tosAccept(){S.user.tos=true;act({action:"tos_ok"}).catch(()=>{});const m=PY.next;S.sub=null;if(m)openPay(m);else render()}
V.join=()=>`<div class="top"><div class="logo">${LOGO}</div><b>Prime Store</b></div><h2 style="margin:14px 2px 8px">🔒 Join to continue</h2><div class="card mut">To use Prime Store you must join our channel(s) first. After joining, tap <b>I've joined</b>.</div>${(S.join||[]).map(j=>j.link?`<a class="btn ghost" href="${esc(j.link)}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px">${esc(j.label)}</a>`:`<div class="card">${esc(j.label)}</div>`).join("")}<button class="btn" id="joinok">✅ I've joined</button>`;
function needJoin(r){if(r&&r.out&&r.out.join&&r.out.join.length){S.join=r.out.join;S.sub="join";render();return true}return false}
async function joinCheck(manual){try{const j=await act({action:"join_check"});const r=await jobWait(j.id);const m=(r.out||{}).missing||[];if(r.status==="done"&&m.length){S.join=m;S.sub="join";render();if(manual)toast("Please join first, then tap again")}else if(r.status==="done"&&S.sub==="join"){S.sub=null;render();if(manual)toast("Thanks! You're in ✅")}}catch(e){if(manual)toast(e.message||"Please try again")}}
const HELP={help:["How it works",()=>`<div class="card mut">1️⃣ <b>Add funds</b> — pay by UPI, Binance Pay or crypto, and your wallet is credited automatically.<br><br>2️⃣ <b>Telegram / WhatsApp account</b> — pick a country, buy, then tap <b>Get code</b> when the code arrives. WhatsApp numbers are refunded if no code comes.<br><br>3️⃣ <b>Social media</b> — pick a platform and service, send your link and quantity, confirm.<br><br>4️⃣ <b>Orders</b> — every order has an ID. Check it any time under <b>Orders</b>.</div><div class="mut" style="margin:0 2px">⚠️ A number cannot be refunded after it has been delivered. Social media orders that fail are refunded to your wallet automatically.</div>`],
hbuy:["How to buy",()=>`<div class="mut" style="margin:0 2px 12px">Your first order in 3 simple steps</div><div class="card mut">1️⃣ <b>Add funds</b><br>Top up your wallet with UPI, Binance Pay or Crypto. It is credited automatically.<br><br>2️⃣ <b>Pick a service</b><br>Choose Telegram numbers, WhatsApp numbers or Social Media services.<br><br>3️⃣ <b>Confirm and receive</b><br>Numbers: tap <b>Get code</b> when the code arrives. Social media: send your link and quantity, then confirm.</div><div class="mut" style="margin:0 2px 12px">⚠️ A delivered number cannot be refunded. Failed social media orders are refunded to your wallet automatically.</div><button class="btn" data-go="recharge">💳 Add funds</button><button class="btn ghost sm" data-go="home">🛒 Start buying</button>`],
hrch:["How to recharge",()=>{const c=CF(),a=[];if((c.upi||{}).on)a.push("💳 <b>UPI</b><br>Pick an amount, pay exactly that amount by QR or UPI ID, then enter your UTR and tap Verify.");if((c.bpay||{}).on)a.push("🅱️ <b>Binance Pay</b><br>Send USDT to the Pay ID, then enter your Order ID and tap Verify.");if((c.crypto||{}).on)a.push("🪙 <b>Crypto</b><br>Pick an amount, tap Pay now and pay with any coin. Your wallet is credited after the network confirms.");return `<div class="mut" style="margin:0 2px 12px">Add money to your wallet in a minute</div>${a.length?a.map(x=>`<div class="card mut">${x}</div>`).join(""):'<div class="card mut">No payment method is set up yet. Please contact support.</div>'}<button class="btn" data-go="recharge">💳 Add funds</button>`}],
hsell:["How to sell",()=>{const u=CF().support;return `<div class="mut" style="margin:0 2px 12px">Got accounts or stock to sell? We buy them.</div><div class="card mut">1️⃣ <b>Message support</b><br>Tell us what you have: the type, the quantity and your price.<br><br>2️⃣ <b>We check it</b><br>Our team reviews the details and replies with an offer.<br><br>3️⃣ <b>Deliver and get paid</b><br>Once the deal is agreed and the items are verified, you receive your payment.</div>${u?`<a class="btn" href="https://t.me/${esc(u)}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">🎧 Contact support</a>`:""}`}]};
V.help=()=>{const h=HELP[HP]||HELP.help;return topBar(h[0],"exit")+h[1]()};

document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn:not(:disabled)");if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,s=document.createElement("span");s.className="rp";s.style.cssText="width:"+d+"px;height:"+d+"px;left:"+(e.clientX-r.left-d/2)+"px;top:"+(e.clientY-r.top-d/2)+"px";b.appendChild(s);setTimeout(()=>s.remove(),700)});
(function(){const sel=".cn,.sq,.hero,.stat,.meth,.ord";let el=null;
const set=(t,x,y)=>{const r=t.getBoundingClientRect(),px=(x-r.left)/r.width-.5,py=(y-r.top)/r.height-.5;t.style.transform="perspective(600px) rotateX("+(-py*7).toFixed(1)+"deg) rotateY("+(px*7).toFixed(1)+"deg) scale(.98)"};
document.addEventListener("pointerdown",e=>{const t=e.target.closest(sel);if(!t||e.target.closest("button,input,select"))return;el=t;t.style.transition="transform .12s";set(t,e.clientX,e.clientY)});
document.addEventListener("pointermove",e=>{if(el)set(el,e.clientX,e.clientY)});
const up=()=>{if(!el)return;const t=el;el=null;t.style.transition="transform .6s cubic-bezier(.34,1.56,.64,1)";t.style.transform=""};
["pointerup","pointercancel"].forEach(n=>document.addEventListener(n,up))})();
document.addEventListener("click",e=>{const t=e.target.closest("[data-stk],[data-of]");if(!t)return;
if(t.dataset.stk){S.stock=!S.stock;ST.set("ps_stock",S.stock);t.querySelector(".sw").classList.toggle("on",S.stock);const g=$("#cg");if(g)g.innerHTML=buyRows();return}
if(t.dataset.of){S.of=t.dataset.of;render()}});
let bk=0,exitArm=0,armed=0;const TH=[];
/* Chrome (Android) skips history entries that a page adds before the user touched it,
   so the back-guard is only pushed after a real touch/click, never on page load. */
function trap(){if(armed)return;try{history.pushState({ps:1},"");armed=1}catch(e){}}
function arm(){if(S.user)trap()}
function appBack(){const ov=document.querySelector(".ov");if(ov){ov.remove();return true}
if(!S.user)return false;
if(S.sub){const b=document.querySelector("#app .top .ic[data-pb]");if(b)b.click();return true}
if(TH.length){go.nb=1;go(TH.pop());go.nb=0;return true}
if(S.tab!=="home"){go.nb=1;go("home");go.nb=0;return true}
return false}
function initBack(){if(bk)return;bk=1;
["pointerup","touchend","click","keydown"].forEach(n=>addEventListener(n,arm,true));
if(navigator.userActivation&&navigator.userActivation.hasBeenActive)trap();
addEventListener("popstate",()=>{armed=0;if(appBack()){trap();return}if(exitArm){exitArm=0;history.back();return}exitArm=1;toast("Press back again to exit");setTimeout(()=>{exitArm=0},2200);trap()})}

boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Store</title>
<style>
:root{--bg1:#FFF5FA;--bg2:#FFDDEB;--ink:#3D1730;--mut:#94607A;--pri:#EA4C8E;--pri2:#FF7DB0;--btn1:#FF9CC6;--btn2:#E8447F;--btnink:#fff;--acc:#FFA25C;--card:rgba(255,255,255,.88);--navbg:rgba(255,255,255,.95);--line:rgba(233,76,142,.18);--ok:#14a077;--bad:#e0436a;--sh:0 10px 26px rgba(233,76,142,.16);--glow:rgba(233,76,142,.34);--blob:#FFB3D1;--blob2:#E3CCFF;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2A0F1F;--bg2:#170812;--ink:#FFEAF4;--mut:#E6A3C4;--pri:#FF9CC6;--pri2:#FF6FA6;--btn1:#FF7DB0;--btn2:#D93A7A;--card:rgba(255,234,244,.07);--navbg:rgba(48,18,34,.96);--line:rgba(255,234,244,.13);--ok:#5bd69b;--bad:#ff7d9d;--sh:0 10px 26px rgba(0,0,0,.45);--glow:rgba(255,111,166,.3);--blob:#8C2458;--blob2:#5a3a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2A0F1F;--bg2:#170812;--ink:#FFEAF4;--mut:#E6A3C4;--pri:#FF9CC6;--pri2:#FF6FA6;--btn1:#FF7DB0;--btn2:#D93A7A;--card:rgba(255,234,244,.07);--navbg:rgba(48,18,34,.96);--line:rgba(255,234,244,.13);--ok:#5bd69b;--bad:#ff7d9d;--sh:0 10px 26px rgba(0,0,0,.45);--glow:rgba(255,111,166,.3);--blob:#8C2458;--blob2:#5a3a8a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--blob) 0%,transparent 68%);opacity:.55;z-index:-1;animation:drift 22s ease-in-out infinite alternate;will-change:transform;pointer-events:none}
body::before{top:-150px;left:-140px}
body::after{bottom:-180px;right:-160px;background:radial-gradient(circle,var(--blob2) 0%,transparent 68%);opacity:.5;animation-delay:-10s;animation-duration:26s}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(60px,70px,0)}}
#app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3{margin:0;letter-spacing:-.01em}

/* scroll reveal (no blur, only transform + opacity) */
.rv{opacity:0;transform:translate3d(0,30px,0) scale(.94);transition:opacity .5s var(--ease) var(--d,0ms),transform .75s var(--spring) var(--d,0ms)}
.g2>.rv:nth-child(odd){transform:translate3d(-26px,24px,0) scale(.94) rotate(-2deg)}
.g2>.rv:nth-child(even){transform:translate3d(26px,24px,0) scale(.94) rotate(2deg)}
.item.rv,.sel.rv,.set.rv,.kv.rv{transform:translate3d(-24px,0,0)}
.rv.in,.g2>.rv.in:nth-child(n){opacity:1;transform:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);transition:transform .3s var(--ease)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:32%;display:grid;place-items:center;color:var(--btnink);background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:var(--sh);animation:float 4s ease-in-out infinite;transition:transform .5s var(--spring)}
.logo svg{width:60%;height:60%}
.logo:active{transform:rotate(-14deg) scale(.9)}
.spk{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-4deg)}}
.top b{font-size:17px}.top .sp{flex:1}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:16px;transition:transform .45s var(--spring)}
.ic:active{transform:scale(.85) rotate(90deg)}
.mut{color:var(--mut);font-size:13px}
.hi h1{font-size:30px;margin-top:2px}
.btn{position:relative;overflow:hidden;width:100%;border:0;border-radius:18px;padding:14px;font:700 15px inherit;font-family:inherit;color:var(--btnink);background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 8px 20px var(--glow);cursor:pointer;transition:transform .3s var(--spring);-webkit-user-select:none;user-select:none}
.btn:not(.sm):not(.ghost)::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-160%) skewX(-20deg);animation:shine 4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,50%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(330%) skewX(-20deg)}}
@media (hover:hover){.btn:hover{transform:translateY(-2px)}}
.btn:active{transform:scale(.94)}.btn:disabled{opacity:.45;box-shadow:none}.btn:disabled::after{display:none}
.btn.sm{padding:9px;font-size:13px;border-radius:14px;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rp .7s var(--ease) forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.big{font-size:38px;font-weight:800;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2 .card{margin:0}
.stat b{display:block;font-size:24px;margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.row a{color:var(--pri);font-size:13px;font-weight:700;cursor:pointer;display:inline-block;transition:transform .3s var(--spring)}
.row a:active{transform:translateX(4px) scale(.95)}
.cn{text-align:center;padding:14px 10px}
.cn:active{transform:scale(.95)}
.fl{font-size:34px;line-height:1.1}
.cn .nm{font-weight:700;margin-top:4px}
.pr{font-size:20px;font-weight:800;margin:6px 0 0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--ink)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tag.ok{animation:blink 2.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.5}}
input,select{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none;transition:border-color .3s,box-shadow .3s var(--ease),transform .35s var(--spring)}
input:focus,select:focus{border-color:var(--pri2);box-shadow:0 0 0 4px var(--glow);transform:translateY(-2px)}
input::placeholder{color:var(--mut);opacity:.8}
.meth{display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid transparent}
.meth:active{transform:scale(.96)}.meth.on{border-color:var(--pri2);box-shadow:0 8px 22px var(--glow)}
.meth .mi{font-size:26px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--line);transition:transform .5s var(--spring)}
.meth.on .mi{transform:scale(1.14) rotate(-8deg)}
.meth div{flex:1}.meth b{display:block}
.chips{display:flex;gap:8px;margin:10px 0}
.chips span{flex:1;text-align:center;padding:8px;border-radius:14px;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:13px;transition:transform .35s var(--spring),border-color .3s,background .3s}
.chips span:active{transform:scale(.88)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item div{flex:1}.item small{display:block;color:var(--mut)}
.sk{height:14px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,var(--line),rgba(255,255,255,.45),var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.set:active{transform:translateX(8px)}
.set:last-child{border:0}.set div{flex:1}.set small{display:block;color:var(--mut);font-size:12px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .3s var(--ease);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .45s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:var(--pri2)}.sw.on::after{transform:translateX(20px)}
select{width:auto;padding:8px 10px;border-radius:12px}
nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(456px,calc(100% - 24px));display:flex;padding:6px;border-radius:30px;background:var(--navbg);border:1px solid var(--line);box-shadow:var(--sh);z-index:5;animation:navin .8s var(--spring) both}
@keyframes navin{from{transform:translate(-50%,130%);opacity:0}}
nav i{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:24px;background:linear-gradient(135deg,var(--btn1),var(--btn2));transition:transform .6s var(--spring);box-shadow:0 6px 16px var(--glow)}
nav button{flex:1;position:relative;border:0;background:none;color:var(--mut);padding:8px 0 6px;font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .3s,transform .35s var(--spring)}
nav button:active{transform:scale(.85)}
nav button.on{color:var(--btnink)}
nav button.on svg{animation:hop .6s var(--spring)}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(1.22)}100%{transform:none}}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px) scale(.9);background:var(--ink);color:var(--bg1);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;transition:transform .55s var(--spring);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0) scale(1)}
.ov{position:fixed;inset:0;background:rgba(48,10,30,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.sheet{width:min(480px,100%);background:var(--bg1);color:var(--ink);border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .55s var(--ease) both}
@keyframes up{from{transform:translateY(100%)}}
.sheet p{display:flex;justify-content:space-between;margin:8px 0}
.lg{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center}
.lg .logo{width:88px;height:88px;margin:0 auto 14px;animation:pop 1s var(--spring) both,float 4s ease-in-out 1s infinite}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}}
.lg h1{text-align:center;font-size:28px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs span{flex:1;text-align:center;padding:9px 4px;border-radius:14px;font-size:13px;font-weight:700;border:1px solid var(--line);opacity:.55;transition:all .35s var(--ease)}
.tabs span.on{opacity:1;background:var(--card);border-color:var(--pri2)}
.hero{background:linear-gradient(135deg,#FF93C0,#E8447F);color:#fff;border:0;position:relative;overflow:hidden;box-shadow:0 14px 30px var(--glow)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:170px;height:170px;border-radius:50%;background:rgba(190,150,255,.4);animation:drift 14s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.2);animation:drift 12s ease-in-out infinite alternate}
.hero>*{position:relative;z-index:1}
.hero .mut{color:rgba(255,255,255,.88)}
.hero .btn{background:#fff;color:#D93A7A;box-shadow:none}
.cn .fl{width:60px;height:60px;margin:0 auto 6px;display:grid;place-items:center;border-radius:50%;background:var(--line);font-size:32px;transition:transform .5s var(--spring)}
.cn:active .fl{transform:scale(1.2) rotate(-10deg)}
.cn{background:linear-gradient(180deg,var(--card),transparent 160%)}
.chips span.on{border-color:var(--pri2);background:var(--card)}
.tiles{margin-top:14px}
.sq{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;padding:16px}
.sq:active{transform:scale(.95)}
.sq .em{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 8px 20px var(--glow);animation:bob 3.6s ease-in-out infinite}
.sq.alt .em{background:linear-gradient(135deg,#FFD3A0,#FFA25C);box-shadow:0 8px 20px rgba(255,162,92,.4);animation-delay:-1.8s}
.sq b{display:block;font-size:17px;line-height:1.2}
.sq .mut{display:block;margin-top:4px}
.sel{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.sel:active{transform:translateX(8px)}
.sel:last-child{border:0}.sel>div{flex:1;min-width:0}.sel small{display:block;color:var(--mut);font-size:12px}.sel b{display:block;overflow-wrap:anywhere}
.sel .ch{flex:none;color:var(--mut);font-size:26px;line-height:1}
.sel.dis{opacity:.4;pointer-events:none}.sel.on b{color:var(--pri)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.kv span{color:var(--mut);flex:none}.kv b{text-align:right;overflow-wrap:anywhere;min-width:0}
.cp{margin-left:8px;border:1px solid var(--line);background:var(--card);color:var(--pri);border-radius:10px;padding:2px 9px;font:700 12px inherit;font-family:inherit;cursor:pointer;transition:transform .3s var(--spring)}
.cp:active{transform:scale(.8)}
.ord{cursor:pointer}.ord:active{transform:scale(.97)}.ord .ch{flex:none;color:var(--mut);font-size:22px}
.tot{display:flex;justify-content:space-between;margin:12px 2px 4px;font-weight:700}
.err{color:var(--bad);font-size:13px;margin:8px 2px;min-height:18px}
.view>div[style*="font-size:52px"],.view>div[style*="font-size:56px"]{animation:pop2 .8s var(--spring) both}
@keyframes pop2{from{transform:scale(.3) rotate(-30deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* bot DP logo */
.logo{position:relative;width:46px;height:46px;border-radius:50%;background:none;box-shadow:0 4px 14px var(--glow);overflow:visible}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;-webkit-user-drag:none}
.logo::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--pri2);opacity:0;animation:ring 2.8s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.55);opacity:0}}
.lg .logo{width:104px;height:104px}

/* ===== simple soft 3D (pink) ===== */
:root{--hi:rgba(255,255,255,.95);--inb:rgba(233,76,142,.08);--inb2:rgba(233,76,142,.2);--shd:rgba(233,76,142,.26);--cardtop:#FFFFFF;--cardbot:#FFF0F7;--inbg:#FFE9F3;--sph:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hi:rgba(255,255,255,.12);--inb:rgba(0,0,0,.2);--inb2:rgba(0,0,0,.45);--shd:rgba(0,0,0,.5);--cardtop:rgba(255,234,244,.11);--cardbot:rgba(255,234,244,.05);--inbg:rgba(0,0,0,.28);--sph:rgba(255,255,255,.2)}}
:root[data-theme="dark"]{--hi:rgba(255,255,255,.12);--inb:rgba(0,0,0,.2);--inb2:rgba(0,0,0,.45);--shd:rgba(0,0,0,.5);--cardtop:rgba(255,234,244,.11);--cardbot:rgba(255,234,244,.05);--inbg:rgba(0,0,0,.28);--sph:rgba(255,255,255,.2)}
.logo{width:44px;height:44px}
.logo::after{content:none}
.lg .logo{width:88px;height:88px}
.card{border-radius:28px;background:linear-gradient(180deg,var(--cardtop),var(--cardbot));border:1px solid var(--line);box-shadow:0 14px 26px -10px var(--shd),inset 0 1.5px 0 var(--hi)}
.hero{border-radius:30px;background:radial-gradient(120% 80% at 18% 0%,rgba(255,255,255,.35),transparent 55%),linear-gradient(135deg,#FF93C0,#E8447F);box-shadow:0 18px 30px -10px var(--glow),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -10px 20px rgba(120,0,60,.12);text-shadow:0 1px 2px rgba(150,20,80,.25)}
.hero .btn{text-shadow:none}
.btn{border-radius:18px;box-shadow:0 10px 18px -6px var(--glow),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(150,20,80,.16)}
.btn.ghost{background:linear-gradient(180deg,var(--cardtop),var(--cardbot));box-shadow:0 5px 10px -4px var(--shd),inset 0 1.5px 0 var(--hi)}
.btn.sm{box-shadow:0 6px 12px -4px var(--glow),inset 0 1.5px 0 rgba(255,255,255,.35)}
.btn:disabled{box-shadow:none}
.hero .btn{box-shadow:0 6px 12px -4px rgba(120,0,60,.25)}
input,select{background:var(--inbg);box-shadow:inset 0 2px 5px var(--inb2)}
input:focus,select:focus{box-shadow:inset 0 2px 5px var(--inb2),0 0 0 4px var(--glow)}
.ic{background:linear-gradient(180deg,var(--cardtop),var(--cardbot));box-shadow:0 6px 12px -4px var(--shd),inset 0 1.5px 0 var(--hi)}
.sq .em{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.45),transparent 50%),linear-gradient(135deg,var(--btn1),var(--btn2))}
.sq.alt .em{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.5),transparent 50%),linear-gradient(135deg,#FFD3A0,#FFA25C)}
.cn .fl,.meth .mi{background:radial-gradient(circle at 30% 25%,var(--sph),var(--cardbot) 80%);box-shadow:0 6px 10px -4px var(--shd),inset 0 -3px 6px var(--inb)}
.chips span{background:linear-gradient(180deg,var(--cardtop),var(--cardbot));box-shadow:0 3px 6px -2px var(--shd),inset 0 1.5px 0 var(--hi)}
nav{box-shadow:0 14px 28px -8px var(--shd),inset 0 1.5px 0 var(--hi)}
nav i{box-shadow:0 8px 16px -4px var(--glow),inset 0 2px 0 rgba(255,255,255,.4)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),RATE=90;
const ST={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={user:null,tab:"home",cur:ST.get("ps_cur","INR"),dark:ST.get("ps_dark",null),bal:0,orders:[],tops:[],tg:[],wa:[],kind:"tg",meth:"UPI",amt:100,bot:"",ready:false};
let C=[];
const flag=c=>/^[A-Za-z]{2}$/.test(c||"")?String.fromCodePoint(...[...c.toUpperCase()].map(x=>127397+x.charCodeAt(0))):"🌍";
const botUrl=()=>"https://t.me/"+S.bot;

return `<h2 style="margin:6px 2px 14px">Recharge balance</h2><div class="card"><span class="mut">Current balance</span><div class="big" style="font-size:30px;margin-bottom:0">${f(S.bal)}</div></div>
${M.map(m=>`<div class="card meth ${S.meth===m[0]?"on":""}" data-m="${m[0]}"><span class="mi">${m[1]}</span><div><b>${m[2]}</b><span class="mut">${m[3]}</span></div><span class="tag ok">ON</span></div>`).join("")}
<div class="card"><span class="mut">Amount in ₹</span><input id="amt" type="number" inputmode="numeric" min="10" value="${S.amt}" style="margin-top:6px"><div class="chips">${[50,100,500,1000].map(a=>`<span data-a="${a}">₹${a}</span>`).join("")}</div><button class="btn" id="pay">Add ₹<span id="pa">${S.amt}</span></button></div>
<div class="row"><h3>Recharge history</h3><a id="rf">Refresh</a></div><div class="card" id="hist"><div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div></div>`},
orders(){return `<h2 style="margin:6px 2px 14px">Orders</h2><div class="card">`+(S.orders.length?S.orders.map(o=>`<div class="item ord" data-ord="${o.k}:${o.i}"><span class="fl" style="font-size:28px">${o.fl}</span><div><b>${esc(o.n)}</b><small>${esc(o.id)} · ${new Date(o.t).toLocaleString()}</small></div><div style="text-align:right;flex:none"><b>${f(o.p)}</b><small class="${o.s==="Completed"?"ok":""}">${esc(o.s)}</small></div><span class="ch">›</span></div>`).join(""):`<div class="mut" style="text-align:center;padding:18px 0">No orders yet. Pick a country in Buy to place your first order.</div><button class="btn" data-go="buy">Go to Buy</button>`)+`</div>`},
settings(){return `<h2 style="margin:6px 2px 14px">Settings</h2><div class="card">
<div class="set" data-s="bot"><span>🤖</span><div><b>Bot connect</b><small>Telegram ID ${S.user.id} · same wallet as the bot</small></div><span class="tag ok">Live</span></div>
<div class="set"><span>💱</span><div><b>Currency</b><small>Choose display currency</small></div><select id="cur"><option value="INR" ${S.cur==="INR"?"selected":""}>₹ INR</option><option value="USDT" ${S.cur==="USDT"?"selected":""}>$ USDT</option></select></div>
<div class="set" data-s="dark"><span>🌙</span><div><b>Dark mode</b><small>Easy on the eyes at night</small></div><span class="sw ${isDark()?"on":""}"></span></div>
<div class="set" data-s="ch"><span>📣</span><div><b>Telegram channel</b><small>Updates and offers</small></div></div>
<div class="set" data-s="sup"><span>🎧</span><div><b>Contact support</b><small>Message us on Telegram</small></div></div>
<div class="set" data-s="out"><span>🚪</span><div><b>Log out</b><small>Sign out from this device</small></div></div></div>`},
login(){return `<div class="lg"><div class="logo">${LOGO}</div><h1>Prime Store</h1><div class="mut" style="text-align:center">Telegram account store</div><div class="card" style="margin-top:20px"><div class="tabs"><span class="on">Telegram</span><span>Email</span><span>Phone</span></div><button class="btn" id="tg">Continue with Telegram</button><div class="mut" id="lmsg" style="text-align:center;margin:12px 0">The bot will send you your ID and password.</div><div class="mut" style="text-align:center">or log in with your ID and password</div><input id="uid" inputmode="numeric" placeholder="Telegram user ID" style="margin:10px 0"><input id="upw" type="password" placeholder="Password" autocomplete="current-password" style="margin-bottom:10px"><button class="btn ghost" id="go">Log in</button></div></div>`}};
let RO;
function stagger(){if(RO)RO.disconnect();if(!("IntersectionObserver" in window))return;
const els=[...document.querySelectorAll("#app .view>*:not(.g2):not(.lg):not(br), #app .g2>*, #app .lg>*:not(.logo), #app .item, #app .sel, #app .set, #app .kv")];
els.forEach(e=>e.classList.add("rv"));
RO=new IntersectionObserver(es=>{let n=0;es.forEach(en=>{if(!en.isIntersecting)return;const e=en.target;RO.unobserve(e);const d=Math.min(n++,8)*70;e.style.setProperty("--d",d+"ms");requestAnimationFrame(()=>e.classList.add("in"));setTimeout(()=>e.classList.remove("rv","in"),1100+d)})},{threshold:.06,rootMargin:"0px 0px -3% 0px"});
els.forEach(e=>RO.observe(e))}
function countUp(){const e=$("#bal");if(!e)return;const t=S.bal,t0=performance.now();(function s(n){const p=Math.min((n-t0)/900,1),v=t*(1-Math.pow(1-p,3));e.textContent=f(v);if(p<1)requestAnimationFrame(s)})(t0)}
function render(){const a=$("#app"),n=$("#nav");theme();
if(!S.user){n.hidden=true;a.innerHTML=`<div class="view">${V.login()}</div>`;stagger();return}
if(S.sub){n.hidden=true;a.innerHTML=`<div class="view">${V[S.sub]()}</div>`;stagger();if(S.sub==="smm")smmCalc();return}
n.hidden=false;n.innerHTML=`<i style="transform:translateX(${TABS.findIndex(t=>t[0]===S.tab)*100}%)"></i>`+TABS.map(t=>`<button data-go="${t[0]}" class="${S.tab===t[0]?"on":""}"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join("");
a.innerHTML=`<div class="view">${V[S.tab]()}</div>`;stagger();
if(S.tab==="home")countUp();if(S.tab==="recharge")loadHist()}
function loadHist(){clearTimeout(loadHist.t);loadHist.t=setTimeout(()=>{const h=$("#hist");if(!h)return;h.innerHTML=S.tops.length?S.tops.map(t=>`<div class="item"><span>💰</span><div><b>${f(t.a)}</b><small>${new Date(t.t).toLocaleString()}</small></div><span class="tag">${t.s}</span></div>`).join(""):`<div class="mut" style="text-align:center">No recharges yet. Add your first balance above.</div>`},900)}
function go(t){const was=S.sub;S.sub=null;if(t===S.tab&&S.user&&!was)return;S.tab=t;render();scrollTo({top:0})}
function sheet(h){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sheet">${h}</div>`;o.onclick=e=>{if(e.target===o||e.target.dataset.x!==undefined)o.remove()};document.body.appendChild(o);return o}
function buy(k){toast("Opening the bot to complete your order");setTimeout(()=>open(botUrl(),"_blank"),600)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-buy],[data-m],[data-a],[data-s],[data-k],#tg,#go,#pay,#rf");if(!t)return;
if(t.dataset.go)return go(t.dataset.go);
if(t.dataset.k){S.kind=t.dataset.k;C=S.kind==="wa"?S.wa:S.tg;return render()}
if(t.dataset.buy)return buy(t.dataset.buy);
if(t.dataset.m){S.meth=t.dataset.m;document.querySelectorAll(".meth").forEach(x=>x.classList.toggle("on",x.dataset.m===S.meth));return}
if(t.dataset.a){$("#amt").value=t.dataset.a;S.amt=+t.dataset.a;$("#pa").textContent=S.amt;return}
if(t.id==="rf"){$("#hist").innerHTML='<div class="sk"></div><div class="sk" style="width:70%"></div>';return loadHist()}
if(t.id==="tg")return tgLogin();
if(t.id==="go")return pwLogin();
if(t.id==="pay"){toast("Opening the bot to add balance");setTimeout(()=>open(botUrl(),"_blank"),600);return}
const s=t.dataset.s;if(s==="dark"){S.dark=!isDark();ST.set("ps_dark",S.dark);theme();t.querySelector(".sw").classList.toggle("on",S.dark)}
else if(s==="out"){fetch("/api/auth",{method:"DELETE"}).finally(()=>{S.user=null;render()})}
else if(s==="bot")open(botUrl(),"_blank");
else if(s)toast("Link will be added soon")});
document.addEventListener("input",e=>{if(e.target.id==="q"){const q=e.target.value.toLowerCase();const r=C.filter(c=>c[0].toLowerCase().includes(q)||c[1].toLowerCase()===q);$("#cg").innerHTML=r.length?r.map(cardC).join(""):'<div class="mut" style="grid-column:1/-1;text-align:center">No country found. Try another name.</div>'}
if(e.target.id==="amt"){S.amt=+e.target.value||0;$("#pa").textContent=S.amt}});
document.addEventListener("change",e=>{if(e.target.id==="cur"){S.cur=e.target.value;ST.set("ps_cur",S.cur);toast("Currency changed to "+S.cur);render()}});
let poll;
const api=b=>fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong");return d});
const msg=t=>{const m=$("#lmsg");if(m)m.textContent=t};
async function tgLogin(){const bt=$("#tg");bt.disabled=true;msg("Opening the bot…");try{const d=await api({action:"start"});open(d.link,"_blank");const m=$("#lmsg");if(m){m.textContent="";const a=document.createElement("a");a.href=d.link;a.target="_blank";a.rel="noopener";a.textContent="Tap here if Telegram did not open";a.style.color="var(--pri)";m.append("Tap Start in the bot and you will be logged in here automatically. ",a)}
clearInterval(poll);const end=Date.now()+3e5;poll=setInterval(async()=>{if(Date.now()>end){clearInterval(poll);bt.disabled=false;return msg("Link expired. Please try again.")}try{const r=await api({action:"poll",tok:d.tok,sec:d.sec});if(r.ok){clearInterval(poll);await boot()}}catch(e){clearInterval(poll);bt.disabled=false;msg(e.message)}},2000)}catch(e){bt.disabled=false;msg(e.message)}}
async function pwLogin(){const id=($("#uid").value||"").replace(/\D/g,""),pw=$("#upw").value;if(!id||!pw)return msg("Enter your ID and password");try{await api({action:"password",id,password:pw});await boot()}catch(e){msg(e.message)}}
async function boot(){try{const r=await fetch("/api/data");const d=await r.json();S.bot=d.bot||S.bot;if(r.ok){S.user=d.user;S.bal=d.balance;S.tg=d.tg;S.wa=d.wa;C=S.kind==="wa"?S.wa:S.tg;S.orders=d.orders;S.tops=d.topups;S.plats=d.plats||[]}else if(r.status===401){S.user=null}else throw 0}catch(e){toast("Could not load data. Please refresh.")}S.ready=true;render()}
/* ---------- Social media services: full pages (form with Platform / Category / Service selectors), order details ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SM={plat:null,plabel:"",cat:null,svc:null,list:null,cache:{},pick:null,q:"",link:"",qty:"",res:null,busy:false,err:"",loading:false};
const smCost=(s,q)=>Math.max(1,Math.ceil(+(s.r*q/1000*100).toFixed(6))); // paise, same formula as the bot
const smQ=()=>parseInt(String(SM.qty).replace(/,/g,""),10);
const cats=L=>{const m=new Map();L.forEach(s=>{const c=s.c||"All services";m.set(c,(m.get(c)||0)+1)});return[...m]};
const inCat=()=>(SM.list||[]).filter(s=>(s.c||"All services")===SM.cat);
const SKEL='<div class="card"><div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div></div>';
const none=t=>`<div class="mut" style="text-align:center;padding:18px 0">${t}</div>`;
const act=b=>fetch("/api/act",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong");return d});
const clip=t=>{try{navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>toast("Could not copy"))}catch(e){toast("Could not copy")}};
const cpb=t=>`<button class="cp" data-cp="${esc(t)}">Copy</button>`;
async function reload(){try{const r=await fetch("/api/data");if(!r.ok)return;const d=await r.json();S.bal=d.balance;S.orders=d.orders;S.tops=d.topups;S.plats=d.plats||[];if(!S.sub&&S.tab!=="recharge")render()}catch(e){}}
async function jobWait(id){const end=Date.now()+105e3;while(Date.now()<end){await new Promise(r=>setTimeout(r,1500));try{const r=await act({action:"job",id});if(["done","error","checking","expired"].includes(r.status))return r}catch(e){}}return{status:"checking",error:"We could not confirm it yet. Please check your Orders before trying again."}}
const topBar=(t,back)=>`<div class="top"><button class="ic" data-pb="${back}" aria-label="Back">←</button><b>${t}</b></div>`;

function smmOpen(){Object.assign(SM,{plat:null,plabel:"",cat:null,svc:null,list:null,cache:{},pick:null,q:"",link:"",qty:"",res:null,busy:false,err:"",loading:false});S.sub="smm";render();scrollTo({top:0})}
function pickRows(){const k=SM.pick,q=(SM.q||"").toLowerCase().trim();
if(k==="plat"){const P=S.plats||[];return P.length?P.map(p=>`<div class="sel ${SM.plat===p[0]?"on":""}" data-sp="${esc(p[0])}"><div><b>${esc(p[1])}</b><small>${p[2]} services</small></div><span class="ch">›</span></div>`).join(""):none("No services are available right now. Please check back soon.")}
if(k==="cat"){const c=cats(SM.list||[]).filter(x=>!q||x[0].toLowerCase().includes(q));return c.length?c.map(x=>`<div class="sel ${SM.cat===x[0]?"on":""}" data-sc="${esc(x[0])}"><div><b>${esc(x[0])}</b><small>${x[1]} services</small></div><span class="ch">›</span></div>`).join(""):none("No category found.")}
const L=inCat().filter(s=>!q||s.n.toLowerCase().includes(q)||String(s.id)===q);
return L.length?L.slice(0,100).map(s=>`<div class="sel ${SM.svc&&SM.svc.id===s.id?"on":""}" data-ss="${s.id}"><div><b>${esc(s.n)}</b><small>${f(s.r)} per 1,000 · Min ${s.lo} · Max ${s.hi}</small></div><span class="ch">›</span></div>`).join("")+(L.length>100?none("Showing 100 of "+L.length+". Search to narrow it down."):""):none("No service found.")}
function pickView(){const t={plat:"Choose platform",cat:"Choose category",svc:"Choose service"}[SM.pick];
return topBar(t,"pick")+(SM.pick==="plat"?"":`<input id="psq" placeholder="Search" autocomplete="off" value="${esc(SM.q)}" style="margin-bottom:12px">`)+`<div class="card" style="padding:4px 16px" id="pl">${pickRows()}</div>`}
function formView(){const s=SM.svc,q=smQ();
return topBar("Social media services","exit")+`<div class="card" style="padding:4px 16px">
<div class="sel" data-pick="plat"><div><small>Platform</small><b>${SM.plat?esc(SM.plabel):"Select platform"}</b></div><span class="ch">›</span></div>
<div class="sel ${SM.plat&&SM.list?"":"dis"}" data-pick="cat"><div><small>Category</small><b>${SM.cat?esc(SM.cat):"Select category"}</b></div><span class="ch">›</span></div>
<div class="sel ${SM.cat?"":"dis"}" data-pick="svc"><div><small>Service</small><b>${s?esc(s.n):"Select service"}</b></div><span class="ch">›</span></div></div>`
+(SM.loading?SKEL:s?`<div class="card" style="padding:4px 16px"><div class="kv"><span>Rate</span><b>${f(s.r)} per 1,000</b></div><div class="kv"><span>Min / Max</span><b>${s.lo} / ${s.hi}</b></div><div class="kv"><span>Refill</span><b>${s.rf?"Yes":"No"}</b></div></div>
<div class="card"><span class="mut">Link</span><input id="sl" placeholder="https://… or @username" autocomplete="off" autocapitalize="off" value="${esc(SM.link)}" ${SM.busy?"disabled":""} style="margin:6px 0 12px"><span class="mut">Quantity</span><input id="sn" type="number" inputmode="numeric" placeholder="${s.lo} to ${s.hi}" value="${esc(SM.qty)}" ${SM.busy?"disabled":""} style="margin:6px 0 4px"><div class="tot"><span>Total</span><span id="stot">${f(q>=s.lo&&q<=s.hi?smCost(s,q)/100:0)}</span></div><div class="mut" style="margin:0 2px">Balance: ${f(S.bal)}</div><div class="err" id="serr">${esc(SM.err)}</div><button class="btn" id="sgo" ${SM.busy?"disabled":""}>${SM.busy?"Placing order…":"Place order"}</button></div>`
:none("Pick a platform, category and service to continue."))}
function resView(){const r=SM.res,ok=r.status==="done";
return topBar(ok?"Order placed":"Order is being checked","exit")+`<div style="text-align:center;font-size:56px;padding:6px 0 14px">${ok?"✅":"⏳"}</div><div class="card" style="padding:4px 16px"><div class="kv"><span>Service</span><b>${esc(r.name)}</b></div><div class="kv"><span>Quantity</span><b>${r.qty}</b></div><div class="kv"><span>Charged</span><b>${f(r.cost)}</b></div><div class="kv"><span>Order ID</span><b>${esc(r.oid)}${cpb(r.oid)}</b></div></div>`
+(ok?"":`<div class="card mut">${esc(r.error||"We are confirming this order. Please do not order again. You will get the result in your Orders and on Telegram.")}</div>`)
+(r.rid?`<button class="btn" data-ord="smm:${r.rid}">View order details</button>`:`<button class="btn" data-pb="orders">View orders</button>`)+`<button class="btn ghost sm" data-pb="again">Order more</button>`}
V.smm=()=>SM.res?resView():SM.pick?pickView():formView();

async function pickPlat(k){const p=(S.plats||[]).find(x=>x[0]===k);Object.assign(SM,{plat:k,plabel:p?p[1]:k,cat:null,svc:null,pick:null,q:"",err:"",list:SM.cache[k]||null});
if(!SM.list){SM.loading=true;render();try{const r=await fetch("/api/data?plat="+encodeURIComponent(k));if(!r.ok)throw 0;const d=await r.json();SM.cache[k]=d.services||[];if(SM.plat!==k)return;SM.list=SM.cache[k]}catch(e){Object.assign(SM,{plat:null,plabel:"",loading:false});toast("Could not load services. Please try again.");return render()}SM.loading=false}
const c=cats(SM.list);if(c.length===1)SM.cat=c[0][0];SM.pick=SM.cat?"svc":"cat";render();scrollTo({top:0})}
function smmCalc(){const s=SM.svc;if(S.sub!=="smm"||SM.pick||SM.res||!s||!$("#stot"))return;const q=smQ(),ok=q>=s.lo&&q<=s.hi,c=ok?smCost(s,q)/100:0,g=$("#sgo"),e=$("#serr");
$("#stot").textContent=f(c);if(ok&&c>S.bal){e.textContent="You need "+f(c-S.bal)+" more.";g.textContent="Add funds";g.dataset.fund="1"}else{if(e.textContent.startsWith("You need"))e.textContent="";g.textContent=SM.busy?"Placing order…":"Place order";delete g.dataset.fund}}
async function smmPlace(){const s=SM.svc,link=SM.link.trim(),q=smQ(),e=$("#serr");
if(!link){e.textContent="Enter the link for this order.";return}
if(!(q>=s.lo&&q<=s.hi)){e.textContent="Enter a quantity between "+s.lo+" and "+s.hi+".";return}
SM.busy=true;SM.err="";render();
try{const d=await act({action:"smm",service_id:s.id,link,qty:q,cost:smCost(s,q)});const r=await jobWait(d.id);SM.busy=false;
if(S.sub!=="smm"){toast(r.status==="done"?"Order placed ✅":(r.error||"Your order is being checked"));return reload()}
if(r.status==="error"||r.status==="expired"){SM.err=r.error||"Could not place the order.";render();return reload()}
SM.res=r;render();scrollTo({top:0});reload()}
catch(err){SM.busy=false;SM.err=err.message;if(S.sub==="smm")render()}}

/* order details page (like the status page in the bot) */
const ICON={Received:"✅",Bought:"📱",Failed:"❌"};
const sIcon=(k,st)=>{const l=String(st||"").toLowerCase();if(k==="smm")return l==="completed"?"✅":["canceled","cancelled","refunded","fail","failed","rejected"].includes(l)?"❌":l==="partial"?"⚠️":"⏳";return ICON[st]||"⏳"};
const kv=(a,b,c)=>b===""||b==null?"":`<div class="kv"><span>${a}</span><b>${b}${c||""}</b></div>`;
V.order=()=>{const d=S.od,t=topBar("Order details","orders");if(!d)return t+SKEL;if(d.err)return t+`<div class="card bad" style="text-align:center">${esc(d.err)}</div>`;
const when=new Date(d.created).toLocaleString(),b=S.odb?"disabled":"";
const head=`<div style="text-align:center;font-size:52px;padding:4px 0 2px">${sIcon(d.k,d.status)}</div><h2 style="text-align:center;margin-bottom:14px">${d.k==="smm"?"Order status":d.k==="wa"?"WhatsApp order":"Number order"}</h2>`;
if(d.k==="smm")return t+head+`<div class="card" style="padding:4px 16px">${kv("Service",esc(d.name))}${kv("Platform",esc(d.plat))}${kv("Status",esc(d.status),"")}${kv("Quantity",d.qty)}${kv("Charged",f(d.cost))}${kv("Start",esc(d.start||"—"))}${kv("Remains",d.remains)}${kv("Refunded",d.refunded?"Yes · "+f(d.refunded):"No")}</div>
<div class="card" style="padding:4px 16px">${kv("Order ID",esc(d.oid),cpb(d.oid))}${kv("Placed",esc(when))}${kv("Link",esc((d.link||"").slice(0,70)),d.link?cpb(d.link):"")}</div>
<div class="card mut">ℹ️ ${esc(d.note)}</div>${d.canRefill?`<button class="btn" id="odl" ${b}>🔁 Request refill</button>`:""}<button class="btn ${d.canRefill?"ghost sm":""}" id="odr" ${b}>🔄 Refresh</button>`;
return t+head+`<div class="card" style="padding:4px 16px">${kv("Order ID",esc(d.oid),cpb(d.oid))}${kv("Country",esc(d.name))}${kv("Number",esc(d.number),d.number?cpb(d.number):"")}${kv("Line",esc(d.op))}${kv("Paid",f(d.cost))}${kv("Status",esc(d.status))}${kv("Placed",esc(when))}${kv("Code",esc(d.code),d.code?cpb(d.code):"")}${kv("Password",esc(d.pass),d.pass?cpb(d.pass):"")}${d.refunded?kv("Refunded",f(d.refunded)):""}</div>${d.note?`<div class="card mut">ℹ️ ${esc(d.note)}</div>`:""}<button class="btn" id="odr" ${b}>🔄 Refresh</button>`};
async function getOrder(k,i){const r=await fetch("/api/data?order="+k+":"+i);const d=await r.json().catch(()=>({}));return r.ok?d:{err:d.error||"Order not found"}}
async function openOrder(k,i){S.sub="order";S.od=null;S.odb=false;render();scrollTo({top:0});try{S.od=await getOrder(k,i)}catch(e){S.od={err:"Could not load. Please try again."}}if(S.sub==="order")render()}
async function odAction(kind){const d=S.od;if(!d||S.odb)return;S.odb=true;render();
try{if(d.k==="smm"&&(kind==="refill"||d.canRefresh)){const j=await act({action:kind==="refill"?"refill":"refresh",rid:d.rid});const r=await jobWait(j.id);toast(r.status==="done"?(r.note||"Updated"):(r.error||"Please try again"))}else toast("Updated");
S.od=await getOrder(d.k,d.rid)}catch(e){toast(e.message||"Please try again")}S.odb=false;if(S.sub==="order")render();reload()}

document.addEventListener("click",e=>{const t=e.target.closest("[data-smm],[data-pick],[data-sp],[data-sc],[data-ss],[data-pb],[data-ord],[data-cp],#sgo,#odr,#odl");if(!t)return;
if(t.dataset.cp!==undefined)return clip(t.dataset.cp);
if(t.dataset.smm!==undefined)return smmOpen();
if(t.dataset.ord!==undefined){const[k,i]=t.dataset.ord.split(":");return openOrder(k,i)}
if(t.id==="odr")return odAction("refresh");if(t.id==="odl")return odAction("refill");
if(t.id==="sgo"){if(t.dataset.fund){S.sub=null;return go("recharge")}return smmPlace()}
if(t.dataset.pick!==undefined){SM.pick=t.dataset.pick;SM.q="";render();return scrollTo({top:0})}
if(t.dataset.pb!==undefined){const v=t.dataset.pb;if(v==="pick"){SM.pick=null;return render()}if(v==="again")return smmOpen();if(v==="orders"){S.sub=null;S.tab="orders";render();return scrollTo({top:0})}S.sub=null;render();return scrollTo({top:0})}
if(t.dataset.sp!==undefined)return pickPlat(t.dataset.sp);
if(t.dataset.sc!==undefined){SM.cat=t.dataset.sc;SM.svc=null;SM.pick="svc";SM.q="";render();return scrollTo({top:0})}
if(t.dataset.ss!==undefined){const s=(SM.list||[]).find(x=>String(x.id)===t.dataset.ss);if(s){SM.svc=s;SM.pick=null;render();scrollTo({top:0})}}});
document.addEventListener("input",e=>{const i=e.target.id;if(i==="psq"){SM.q=e.target.value;$("#pl").innerHTML=pickRows()}else if(i==="sl")SM.link=e.target.value;else if(i==="sn"){SM.qty=e.target.value;smmCalc()}});

document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn:not(:disabled)");if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,s=document.createElement("span");s.className="rp";s.style.cssText="width:"+d+"px;height:"+d+"px;left:"+(e.clientX-r.left-d/2)+"px;top:"+(e.clientY-r.top-d/2)+"px";b.appendChild(s);setTimeout(()=>s.remove(),700)});
(function(){const sel=".cn,.sq,.hero,.stat,.meth,.ord";let el=null;
const set=(t,x,y)=>{const r=t.getBoundingClientRect(),px=(x-r.left)/r.width-.5,py=(y-r.top)/r.height-.5;t.style.transform="perspective(600px) rotateX("+(-py*7).toFixed(1)+"deg) rotateY("+(px*7).toFixed(1)+"deg) scale(.98)"};
document.addEventListener("pointerdown",e=>{const t=e.target.closest(sel);if(!t||e.target.closest("button,input,select"))return;el=t;t.style.transition="transform .12s";set(t,e.clientX,e.clientY)});
document.addEventListener("pointermove",e=>{if(el)set(el,e.clientX,e.clientY)});
const up=()=>{if(!el)return;const t=el;el=null;t.style.transition="transform .6s cubic-bezier(.34,1.56,.64,1)";t.style.transform=""};
["pointerup","pointercancel"].forEach(n=>document.addEventListener(n,up))})();
boot();
</script>
</body>
</html>
